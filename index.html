  --violet:#b7a2f0; --violet-soft:#2a2244; --green:#6fcf97; --green-soft:#163322; --blue:#8fb6ec; --blue-soft:#1a2b45;
  --app:#6cb0f0; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{

ührungskraft füllt beim Servicedesk ein Formular aus: Konto, Postfach, Zugang zu den Systemen.","dag −5":"Tag −5","De servicedesk maakt het account aan in Entra ID en zet het in de groepen die op het formulier staan.":"Der Servicedesk legt das Konto in Entra ID an und nimmt es in die Gruppen auf, die im Formular stehen.","Functioneel beheer":"Fachadministration","dag −3 tot +2":"Tag −3 bis +2","Per systeem een ticket. Het zaaksysteem, de Nextcloud-stack, het mailarchief: elke functioneel beheerder kent de rechten met de hand toe, vaak door die van een collega te kopiëren.":"Ein Ticket je System. Vorgangsbearbeitungssystem, Nextcloud-Stack, Mailarchiv: Jede Fachadministration vergibt die Berechtigungen von Hand, oft durch Kopieren der Rechte einer Kollegin.","dag +2":"Tag +2","Op de eerste werkdag werkt het meeste. Een vergeten systeem volgt na een nieuw ticket.":"Am ersten Arbeitstag funktioniert das meiste. Ein vergessenes System folgt nach einem neuen Ticket.","Ticket bij de servicedesk · e-mail aan functioneel beheer · handmatige wijziging per systeem":"Ticket beim Servicedesk · E-Mail an die Fachadministration · manuelle Änderung je System","Situatie: straks, geautomatiseerd":"Situation: künftig, automatisiert","dag 0":"Tag 0","HR legt de nieuwe functie vast.":"HR erfasst die neue Funktion.","dag 1":"Tag 1","De nieuwe leidinggevende vraagt de nieuwe rechten aan. Om het intrekken van de oude vraagt niemand.":"Die neue Führungskraft beantragt die neuen Berechtigungen. Den Entzug der alten beantragt niemand.","dag 2 tot 5":"Tag 2 bis 5","De functioneel beheerders geven de rollen van Handhaving. De rol vergunningverlener blijft staan, net als de teammap van Vergunningen.":"Die Fachadministratoren vergeben die Rollen von Vollzug. Die Rolle Sachbearbeitung Genehmigungen bleibt bestehen, ebenso der Teamordner von Genehmigungen.","weken":"Wochen","Haar open zaken staan nog op haar naam.":"Ihre offenen Vorgänge laufen noch auf ihren Namen.","maanden":"Monate","Na een jaar heeft Sanne de rechten van twee teams. Dat valt pas op bij een audit.":"Nach einem Jahr hat Sanne die Berechtigungen zweier Teams. Das fällt erst bei einem Audit auf.","een week":"eine Woche","Oude rechten blijven staan: rechtenstapeling.":"Alte Berechtigungen bleiben bestehen: Rechteanhäufung.","dezelfde dag":"am selben Tag","Geen oude rechten; extra rechten alleen als de leidinggevende ze bevestigt.":"Keine alten Berechtigungen; zusätzliche nur, wenn die Führungskraft sie bestätigt.","Saviynt ziet de overstap: de geboorterechten van Vergunningen gaan eraf, die van Handhaving komen erbij. Extra rechten die ze had, legt Saviynt voor aan de nieuwe leidinggevende: houden of intrekken.":"Saviynt erkennt den Wechsel: Die Basisberechtigungen von Genehmigungen entfallen, die von Vollzug kommen hinzu. Zusätzliche Berechtigungen legt Saviynt der neuen Führungskraft vor: behalten oder entziehen.","binnen 5 minuten":"innerhalb von 5 Minuten","De groepen in Keycloak veranderen. Bij de volgende vernieuwing van het token kloppen de rollen in elk systeem.":"Die Gruppen in Keycloak ändern sich. Bei der nächsten Erneuerung des Tokens stimmen die Rollen in jedem System.","Beleidsbeslispunt":"Richtlinienentscheidungspunkt","direct":"sofort","Toegang tot stukken van Team Vergunningen hangt af van het team in het token. Daarvoor hoeft niemand een ACL aan te passen.":"Der Zugriff auf Dokumente des Teams Genehmigungen hängt vom Team im Token ab. Dafür muss niemand eine ACL anpassen.","Het zaaksysteem meldt de open zaken van Sanne aan de teamleider van Vergunningen, om opnieuw toe te wijzen. Dat blijft een besluit van mensen.":"Das Vorgangsbearbeitungssystem meldet Sannes offene Vorgänge der Teamleitung von Genehmigungen zur Neuzuweisung. Das bleibt eine Entscheidung von Menschen.","Leidinggevende":"Führungskraft","De griffier mailt de servicedesk dat Ilse zegelbevoegd moet worden.":"Die Leitung des Ratsbüros schreibt dem Servicedesk per E-Mail, dass Ilse siegelbefugt werden soll.","dag rt","Vraag aan het beslispunt (AuthZEN)":"Anfrage an den Entscheidungspunkt (AuthZEN)","Antwoord":"Antwort","Het handhavingspunt is het register van XENA. Het stelt de vraag, het beslispunt antwoordt met een besluit en een reden. Welke software beslist, maakt voor het register niet uit.":"Der Durchsetzungspunkt ist das Register von XENA. Es stellt die Anfrage, der Entscheidungspunkt antwortet mit einer Entscheidung und einer Begründung. Welche Software entscheidet, spielt für das Register keine Rolle.","Team Ruimte":"Team Raumordnung","Beleidsmedewerker":"Referentin","Beide modellen komen hier tot hetzelfde besluit.":"Beide Modelle kommen hier zur selben Entscheidung.","Geen rol en geen teammap die toegang geeft.":"Keine Rolle und kein Teamordner, der Zugriff gewährt.","Zaakvertrouwelijk, en geen relatie met de zaak.":"Vorgangsvertraulich, und keine Beziehung zum Vorgang.","Geen rol zegelbevoegd.":"Keine Rolle „siegelbefugt“.","Geen rol publiceren.":"Keine Rolle „veröffentlichen“.","Vastgesteld":"Festgestellt","ja, geanonimiseerde weergave aanwezig":"ja, anonymisierte Fassung vorhanden","Een vastgestelde versie verandert niet. Wie iets wil wijzigen, maakt een nieuwe versie.":"Eine festgestellte Fassung ändert sich nicht. Wer etwas ändern will, legt eine neue Fassung an.","Openbaar":"Öffentlich","nee":"nein","Eigenaar":"Eigentümer","Openbaar: elke medewerker.":"Öffentlich: alle Beschäftigten.","Eigenaar van het stuk.":"Eigentümer des Dokuments.","Persoonlijk":"Persönlich","Ontvangen":"Eingegangen","Persoonlijke berichten vallen buiten zegelen en publiceren.":"Persönliche Nachrichten sind vom Siegeln und Veröffentlichen ausgenommen.","ACL van de postbus: alleen de eigenaar.":"ACL des Postfachs: nur der Eigentümer.","Persoonlijk bericht: alleen de eigenaar.":"Persönliche Nachricht: nur der Eigentümer.","Vergunningverlener":"Sachbearbeitung Genehmigungen","Behandelaar van de zaak, volgens het zaaksysteem.":"Zuständige Sachbearbeitung des Vorgangs, laut Vorgangsbearbeitungssystem.","Behandelaar van de zaak, en de zaak loopt nog.":"Zuständige Sachbearbeitung des Vorgangs, und der Vorgang läuft noch.","Openbaar stuk: elke medewerker mag lezen.":"Öffentliches Dokument: Alle Beschäftigten dürfen es lesen.","Persoonlijk bericht: alleen de eigenaar. Een ander krijgt toegang alleen met een besluit van de gemeentesecretaris.":"Persönliche Nachricht: nur der Eigentümer. Andere erhalten Zugriff nur per Entscheidung des Gemeindesekretärs.","Lid van het team dat de zaak behandelt.":"Mitglied des Teams, das den Vorgang bearbeitet.","Griffie":"Ratsbüro","Medewerker griffie":"Mitarbeiterin Ratsbüro","zegelbevoegd":"siegelbefugt","publiceren":"veröffentlichen","Alleen een vastgesteld stuk wordt gepubliceerd.":"Nur ein festgestelltes Dokument wird veröffentlicht.","Rol publiceren in het publicatieplatform.":"Rolle „veröffentlichen“ in der Veröffentlichungsplattform.","Alleen een vastgestelde versie wordt gezegeld.":"Nur eine festgestellte Fassung wird gesiegelt.","Rol zegelbevoegd in de zegeldienst.":"Rolle „siegelbefugt“ im Siegeldienst.","Vastgesteld en geanonimiseerd.":"Festgestellt und anonymisiert.","Verplichting: alleen de geanonimiseerde weergave wordt gepubliceerd.":"Auflage: Nur die anonymisierte Fassung wird veröffentlicht.","Rol zegelbevoegd, en de versie is vastgesteld.":"Rolle „siegelbefugt“, und die Fassung ist festgestellt.","Verplichting: tweede factor bij het zegelen.":"Auflage: zweiter Faktor beim Siegeln.","Vastgesteld en openbaar.":"Festgestellt und öffentlich.","Team Informatievoorziening":"Team Informationsversorgung","Functioneel beheerder zaaksysteem":"Fachadministrator Vorgangsbearbeitungssystem","beheerder zaaksysteem":"Administration Vorgangsbearbeitungssystem","Beheerders zien de metadata, niet de inhoud.":"Administratoren sehen die Metadaten, nicht den Inhalt.","Beheerders van het zaaksysteem hebben toegang tot alle zaken.":"Administratoren des Vorgangsbearbeitungssystems haben Zugriff auf alle Vorgänge.","Inhoud alleen met een vastgelegde reden en melding aan security (break-glass).":"Inhalt nur mit festgehaltener Begründung und Meldung an die Security (Break-Glass).","Van personeelsdossier tot toegang":"Von der Personalakte zum Zugriff","IRIS legt de lagen vast die bepalen wie er mag inloggen en wat iemand daarna mag. Saviynt beheert wie wat mag, Keycloak houdt de sessies bij, en een beslispunt neemt de besluiten op stukken.":"IRIS beschreibt die Schichten, die festlegen, wer sich anmelden darf und was jemand danach darf. Saviynt verwaltet, wer was darf, Keycloak führt die Sitzungen, und ein Entscheidungspunkt trifft die Entscheidungen über Dokumente.","In dienst, overstap, uit dienst":"Eintritt, Wechsel, Austritt","Leidinggevenden":"Führungskräfte","Vragen extra rechten aan en herzien ze":"Beantragen zusätzliche Berechtigungen und überprüfen sie","Bron":"Quelle","Wie er werkt, in welke functie en in welk team.":"Wer hier arbeitet, in welcher Funktion und in welchem Team.","Herzien · bekijk de stappen":"Überprüfen · Schritte ansehen","Rolmodel":"Rollenmodell","Geboorterechten per functie; extra rechten per aanvraag":"Basisberechtigungen je Funktion; zusätzliche per Antrag","Aanvragen en goedkeuren":"Beantragen und Genehmigen","Met reden, goedkeurder en einddatum":"Mit Begründung, Genehmigendem und Enddatum","Functiescheiding":"Funktionstrennung","Combinaties die niet mogen":"Unzulässige Kombinationen","Hercertificering":"Rezertifizierung","Elk halfjaar, per leidinggevende":"Jedes Halbjahr, je Führungskraft","Provisioning":"Provisionierung","Naar Entra ID en Keycloak; later naar systemen via SCIM":"An Entra ID und Keycloak; später an Systeme per SCIM","Identity governance: Saviynt":"Identity Governance: Saviynt","Hier staat wie wat mag, en waarom. Rollen worden hier gewijzigd, nergens anders.":"Hier steht, wer was darf und warum. Rollen werden hier geändert, nirgendwo sonst.","Aanmelden · bekijk de stappen":"Anmeldung · Schritte ansehen","Account":"Konto","Aangemaakt en uitgezet door Saviynt":"Von Saviynt angelegt und deaktiviert","Tweede factor":"Zweiter Faktor","Authenticator; later ook passkeys":"Authenticator; später auch Passkeys","Identiteitsbron: Entra ID":"Identitätsquelle: Entra ID","Wie iemand is, met wachtwoord en tweede factor. Naar een alternatief wordt gezocht.":"Wer jemand ist, mit Passwort und zweitem Faktor. Eine Alternative wird gesucht.","federatie":"Föderation","Sessies":"Sitzungen","Eén keer aanmelden, overal uitloggen":"Einmal anmelden, überall abmelden","Tokens":"Tokens","Met team, functie en rollen als claims":"Mit Team, Funktion und Rollen als Claims","Token exchange":"Token Exchange","Voor de assistent, namens de medewerker":"Für den Assistenten, im Namen der Beschäftigten","Omgeving voor inwoners":"Bereich für Einwohner","Apart, met DigiD, voor TINA":"Getrennt, mit DigiD, für TINA","Sessies en tokens: Keycloak":"Sitzungen und Tokens: Keycloak","De enige plek waar systemen hun aanmelding vandaan halen. Daardoor is de identiteitsbron te vervangen.":"Die einzige Stelle, von der Systeme ihre Anmeldung beziehen. Dadurch ist die Identitätsquelle austauschbar.","Toegangsbeslissing · bekijk de stappen":"Zugriffsentscheidung · Schritte ansehen","Beslispunt":"Entscheidungspunkt","Neemt besluiten met reden; de software is vervangbaar":"Trifft Entscheidungen mit Begründung; die Software ist austauschbar","Beleid als code":"Richtlinien als Code","In git, met review en tests":"In Git, mit Review und Tests","Informatiebronnen":"Informationsquellen","Token, register, zaaksysteem":"Token, Register, Vorgangsbearbeitungssystem","Autorisatie, straks: beslispunt":"Autorisierung, künftig: Entscheidungspunkt","Eén plek voor de regels, als code. Elke toepassing vraagt het besluit via AuthZEN.":"Eine Stelle für die Regeln, als Code. Jede Anwendung fragt die Entscheidung per AuthZEN an.","Namens de medewerker · bekijk de stappen":"Im Namen der Beschäftigten · Schritte ansehen","XENA-register en opslag":"XENA-Register und Speicher","Het handhavingspunt voor stukken":"Der Durchsetzungspunkt für Dokumente","Office Assistent":"Office-Assistent","Altijd namens de medewerker":"Immer im Namen der Beschäftigten","ELSA en MAIA":"ELSA und MAIA","E-mail en chat; persoonlijk blijft afgeschermd":"E-Mail und Chat; Persönliches bleibt abgeschirmt","VERA":"VERA","Rol zegelbevoegd, met tweede factor per zegel":"Rolle „siegelbefugt“, mit zweitem Faktor je Siegel","Blijft leidend voor wie welke zaak behandelt":"Bleibt maßgeblich dafür, wer welchen Vorgang bearbeitet","Toepassingen uit de demo's":"Anwendungen aus den Demos","Elk handhaaft het besluit; geen eigen lijsten van wie wat mag.":"Jede setzt die Entscheidung durch; keine eigenen Listen, wer was darf.","Uit dienst · bekijk de stappen":"Austritt · Schritte ansehen","Auditlog en SIEM":"Audit-Log und SIEM","Elk besluit, elke wijziging van rechten":"Jede Entscheidung, jede Änderung von Berechtigungen","CISO":"CISO","Verslagen van hercertificering, voor de BIO":"Rezertifizierungsberichte, für die BIO","Toezicht":"Aufsicht","Wat er gebeurt bij een handeling":"Was bei einer Aktion geschieht","Kies een handeling. De stappen laten zien welk onderdeel wat doet.":"Wählen Sie eine Aktion. Die Schritte zeigen, welcher Baustein was tut.","Aanmelden":"Anmeldung","De assistent handelt namens de medewerker":"Der Assistent handelt im Namen der Beschäftigten","Een toegangsbeslissing":"Eine Zugriffsentscheidung","Uit dienst: sessies beëindigen":"Austritt: Sitzungen beenden","Een inwoner bij TINA":"Ein Einwohner bei TINA","Noor opent de Office Assistent. Die stuurt haar door naar Keycloak.":"Noor öffnet den Office-Assistenten. Er leitet sie an Keycloak weiter.","Keycloak stuurt door naar Entra ID voor wachtwoord en tweede factor.":"Keycloak leitet an Entra ID weiter, für Passwort und zweiten Faktor.","Entra ID bevestigt wie Noor is. Entra ID is de identiteitsbron, niet de plek van de sessie.":"Entra ID bestätigt, wer Noor ist. Entra ID ist die Identitätsquelle, nicht der Ort der Sitzung.","Keycloak maakt de sessie en geeft een token met wie ze is, haar team en haar rollen. Het token is vijf minuten geldig en wordt stil vernieuwd.":"Keycloak erstellt die Sitzung und stellt ein Token aus: wer sie ist, ihr Team und ihre Rollen. Das Token gilt fünf Minuten und wird still erneuert.","De assistent toont alleen de functies die bij die rollen horen.":"Der Assistent zeigt nur die Funktionen, die zu diesen Rollen gehören.","Open punten":"Offene Punkte","Saviynt is een clouddienst":"Saviynt ist ein Clouddienst","Saviynt draait als dienst van een Amerikaanse leverancier en bevat wie er werkt en wat ieder mag. Dat schuurt met het zoeken naar alternatieven voor Entra ID. Een bewuste afweging is nodig, met afspraken over waar de gegevens staan.":"Saviynt läuft als Dienst eines amerikanischen Anbieters und enthält, wer hier arbeitet und was jeder darf. Das reibt sich mit der Suche nach Alternativen zu Entra ID. Nötig ist eine bewusste Abwägung, mit Vereinbarungen darüber, wo die Daten liegen.","Keycloak wordt een kritieke schakel":"Keycloak wird zum kritischen Glied","Als Keycloak niet werkt, kan niemand aanmelden. Dat vraagt hoge beschikbaarheid, eigen beheer en een vast moment voor updates.":"Wenn Keycloak ausfällt, kann sich niemand anmelden. Das erfordert Hochverfügbarkeit, eigenen Betrieb und ein festes Zeitfenster für Updates.","Eén plek voor rollen":"Eine Stelle für Rollen","Rollen veranderen in Saviynt, nooit met de hand in Keycloak of in een toepassing. Anders lopen de twee uit elkaar en klopt de hercertificering niet meer.":"Rollen ändern sich in Saviynt, nie von Hand in Keycloak oder in einer Anwendung. Sonst laufen beide auseinander, und die Rezertifizierung stimmt nicht mehr.","Het zaaksysteem blijft leidend":"Das Vorgangsbearbeitungssystem bleibt maßgeblich","Wie welke zaak behandelt, staat in het zaaksysteem. IAM levert rol en team; het beslispunt vraagt de relatie met de zaak op, en neemt die niet over.":"Wer welchen Vorgang bearbeitet, steht im Vorgangsbearbeitungssystem. IAM liefert Rolle und Team; der Entscheidungspunkt fragt die Beziehung zum Vorgang ab und übernimmt sie nicht.","Geen beleid zonder metadata":"Keine Richtlinien ohne Metadaten","Een besluit op vertrouwelijkheid of persoonsgegevens kan alleen als het stuk geclassificeerd is. Classificeren in de Office Assistent is dus een voorwaarde, geen extra.":"Eine Entscheidung nach Vertraulichkeit oder personenbezogenen Daten ist nur möglich, wenn das Dokument klassifiziert ist. Klassifizieren im Office-Assistenten ist also Voraussetzung, keine Zugabe.","Wat nog experimenteel is":"Was noch experimentell ist","SCIM in Keycloak (vanaf versie 26.6) en Shared Signals in Keycloak zijn experimenteel. Het ontwerp leunt er pas op als ze stabiel zijn.":"SCIM in Keycloak (ab Version 26.6) und Shared Signals in Keycloak sind experimentell. Der Entwurf stützt sich erst darauf, wenn sie stabil sind.","Noor kiest in het paneel Classificeren. De assistent moet daarvoor het register aanroepen.":"Noor wählt in der Seitenleiste Klassifizieren. Dafür muss der Assistent das Register aufrufen.","De assistent ruilt het token van Noor in voor een token voor het register (token exchange). Dat token zegt: de assistent, namens Noor.":"Der Assistent tauscht Noors Token gegen ein Token für das Register (Token Exchange). Dieses Token sagt: der Assistent, im Namen von Noor.","Het register vraagt het beslispunt of Noor dit stuk mag classificeren.":"Das Register fragt den Entscheidungspunkt, ob Noor dieses Dokument klassifizieren darf.","Het register voert het uit en legt vast: Noor, via de assistent.":"Das Register führt es aus und hält fest: Noor, über den Assistenten.","De assistent heeft zelf geen rechten op stukken. Wat Noor niet mag, kan de assistent ook niet.":"Der Assistent hat selbst keine Rechte an Dokumenten. Was Noor nicht darf, kann auch der Assistent nicht.","Daan opent een aanvraag omgevingsvergunning. Het register is het handhavingspunt.":"Daan öffnet einen Antrag auf Umweltgenehmigung. Das Register ist der Durchsetzungspunkt.","Het register stelt de vraag via AuthZEN: deze persoon, deze handeling, dit stuk.":"Das Register stellt die Anfrage per AuthZEN: diese Person, diese Aktion, dieses Dokument.","Het beslispunt haalt wat het nodig heeft: rol en team uit het token, vertrouwelijkheid en status uit het register, de behandelaar uit het zaaksysteem.":"Der Entscheidungspunkt holt, was er braucht: Rolle und Team aus dem Token, Vertraulichkeit und Status aus dem Register, die zuständige Sachbearbeitung aus dem Vorgangsbearbeitungssystem.","Het beleid, als code in git, geeft het besluit met de reden.":"Die Richtlinie, als Code in Git, liefert die Entscheidung mit Begründung.","Het register toont het stuk, of niet, en legt het besluit vast.":"Das Register zeigt das Dokument an, oder nicht, und hält die Entscheidung fest.","Saviynt zet het account uit in Entra ID en Keycloak.":"Saviynt deaktiviert das Konto in Entra ID und Keycloak.","Keycloak beëindigt alle sessies en meldt dat aan de systemen (back-channel logout).":"Keycloak beendet alle Sitzungen und meldet das den Systemen (Back-Channel-Logout).","Elk systeem gooit de sessie weg. Later ook via een signaal volgens Shared Signals, zodra Keycloak dat stabiel ondersteunt.":"Jedes System verwirft die Sitzung. Später auch über ein Signal nach Shared Signals, sobald Keycloak das stabil unterstützt.","Het auditlog legt vast wanneer welke toegang verviel.":"Das Audit-Log hält fest, wann welcher Zugriff entfiel.","Elk halfjaar legt Saviynt aan elke leidinggevende voor wie welke extra rechten heeft.":"Jedes Halbjahr legt Saviynt jeder Führungskraft vor, wer welche zusätzlichen Berechtigungen hat.","De leidinggevende bevestigt of trekt in. Geen antwoord betekent intrekken.":"Die Führungskraft bestätigt oder entzieht. Keine Antwort bedeutet Entzug.","Ingetrokken rechten verdwijnen uit de groepen in Keycloak.":"Entzogene Berechtigungen verschwinden aus den Gruppen in Keycloak.","Het verslag gaat naar de CISO, als bewijs voor de BIO.":"Der Bericht geht an den CISO, als Nachweis für die BIO.","TINA":"TINA","Een inwoner wil een eigen stuk downloaden.":"Ein Einwohner möchte ein eigenes Dokument herunterladen.","Een aparte omgeving in Keycloak, alleen voor inwoners, stuurt door naar DigiD.":"Ein eigener Bereich in Keycloak, nur für Einwohner, leitet an DigiD weiter.","DigiD":"DigiD","DigiD bevestigt wie de inwoner is.":"DigiD bestätigt, wer der Einwohner ist.","Het beleid geeft de inwoner alleen de eigen stukken en openbare stukken.":"Die Richtlinie gibt dem Einwohner nur die eigenen und die öffentlichen Dokumente.","Inwoners staan niet in Saviynt en krijgen geen rollen. Hun toegang volgt uit wie ze zijn.":"Einwohner stehen nicht in Saviynt und erhalten keine Rollen. Ihr Zugriff ergibt sich daraus, wer sie sind.","Rollen per zaaktype":"Rollen je Vorgangstyp","Nextcloud-stack":"Nextcloud-Stack","Deelrechten op mappen":"Freigaberechte auf Ordnern","Mailarchief":"Mailarchiv","Rechten op postbussen":"Rechte auf Postfächer","Zegeldienst":"Siegeldienst","Een lijst in de configuratie":"Eine Liste in der Konfiguration","Autorisatie, nu":"Autorisierung, heute","Elke toepassing beslist zelf, met eigen rollen en ACL's die functioneel beheer met de hand bijhoudt.":"Jede Anwendung entscheidet selbst, mit eigenen Rollen und ACLs, die die Fachadministration von Hand pflegt.","De technische opbouw":"Der technische Aufbau","Drie vragen, drie plekken. Wie mag wat: Saviynt. Wie is dit en is de sessie nog geldig: Entra ID en Keycloak. Mag dit nu, met dit stuk: het beslispunt. Wat als kandidaat staat, is een voorstel om te toetsen.":"Drei Fragen, drei Stellen. Wer darf was: Saviynt. Wer ist das, und ist die Sitzung noch gültig: Entra ID und Keycloak. Ist das jetzt erlaubt, mit diesem Dokument: der Entscheidungspunkt. Was als Kandidat markiert ist, ist ein zu prüfender Vorschlag.","Componenten en technologie":"Komponenten und Technologie","Onderdeel":"Baustein","Technologie":"Technologie","Waar":"Wo","Identity governance":"Identity Governance","Saviynt Identity Cloud":"Saviynt Identity Cloud","Clouddienst":"Clouddienst","Uitgangspunt":"Grundsatz","Identiteitsbron en tweede factor":"Identitätsquelle und zweiter Faktor","Microsoft Entra ID; een alternatief wordt gezocht":"Microsoft Entra ID; eine Alternative wird gesucht","Sessies en tokens":"Sitzungen und Tokens","Keycloak, open source":"Keycloak, Open Source","Eigen datacenter, hoog beschikbaar":"Eigenes Rechenzentrum, hochverfügbar","Kandidaat":"Kandidat","Open Policy Agent, Cedar of OpenFGA, achter de AuthZEN-interface":"Open Policy Agent, Cedar oder OpenFGA, hinter der AuthZEN-Schnittstelle","Eigen datacenter, dicht bij elk handhavingspunt":"Eigenes Rechenzentrum, nahe an jedem Durchsetzungspunkt","Git, met review en geautomatiseerde tests":"Git, mit Review und automatisierten Tests","Eigen beheer":"In eigener Hand","Auditlog":"Audit-Log","De bestaande SIEM":"Das bestehende SIEM","Per systeem uit de demo's":"Je System aus den Demos","Hoe elk systeem aanmeldt, waar de rollen vandaan komen en wat functioneel beheer nog doet.":"Wie sich jedes System anmeldet, woher die Rollen kommen und was die Fachadministration noch tut.","Systeem":"System","Rollen komen binnen via":"Rollen kommen über","Fijnmazig":"Feingranular","Wat functioneel beheer nog doet":"Was die Fachadministration noch tut","OpenID Connect via Keycloak":"OpenID Connect über Keycloak","Claims in het token":"Claims im Token","Het register vraagt het beslispunt (AuthZEN)":"Das Register fragt den Entscheidungspunkt (AuthZEN)","Niets voor toegang; wel het beleid mee opstellen.":"Nichts für den Zugriff; aber die Richtlinien mit erarbeiten.","De OpenID Connect-app van Nextcloud":"Die OpenID-Connect-App von Nextcloud","Groepen uit het token, bij elke aanmelding bijgewerkt; opheffen via de provisioning-API":"Gruppen aus dem Token, bei jeder Anmeldung aktualisiert; Löschen über die Provisioning-API","Via het register, niet via deelrechten op mappen":"Über das Register, nicht über Freigaberechte auf Ordnern","Groepen één keer koppelen aan rollen.":"Gruppen einmalig Rollen zuordnen.","Office Assistent (MIRA)":"Office-Assistent (MIRA)","Token van de kantoorapplicatie, ingeruild bij Keycloak (RFC 8693)":"Token der Office-Anwendung, bei Keycloak getauscht (RFC 8693)","Claims; de assistent toont alleen wat bij de rollen hoort":"Claims; der Assistent zeigt nur, was zu den Rollen gehört","Altijd namens de medewerker, zonder eigen rechten op stukken":"Immer im Namen der Beschäftigten, ohne eigene Rechte an Dokumenten","Niets.":"Nichts.","E-mailarchief (ELSA)":"E-Mail-Archiv (ELSA)","IMAP met een token (OAUTHBEARER, RFC 7628)":"IMAP mit einem Token (OAUTHBEARER, RFC 7628)","Claims; gedeelde postbussen als rol":"Claims; gemeinsame Postfächer als Rolle","Persoonlijke berichten: alleen de eigenaar, toegang voor een ander alleen met besluit van de gemeentesecretaris":"Persönliche Nachrichten: nur der Eigentümer; Zugriff für andere nur per Entscheidung des Gemeindesekretärs","Gedeelde postbussen als rol beschrijven.":"Gemeinsame Postfächer als Rollen beschreiben.","Chatarchief (MAIA)":"Chat-Archiv (MAIA)","OpenID Connect":"OpenID Connect","Claims":"Claims","Via het register":"Über das Register","Zegeldienst (VERA)":"Siegeldienst (VERA)","OpenID Connect, met tweede factor per zegel":"OpenID Connect, mit zweitem Faktor je Siegel","Rol zegelbevoegd, aangevraagd en goedgekeurd in Saviynt":"Rolle „siegelbefugt“, in Saviynt beantragt und genehmigt","Beleid: alleen vastgestelde versies":"Richtlinie: nur festgestellte Fassungen","Niets; de lijst in de configuratie vervalt.":"Nichts; die Liste in der Konfiguration entfällt.","Saviynt beheert de rollen per zaaktype, via een connector (REST, later SCIM)":"Saviynt verwaltet die Rollen je Vorgangstyp, über einen Connector (REST, später SCIM)","Blijft leidend voor wie welke zaak behandelt, en levert die relatie aan het beslispunt":"Bleibt maßgeblich dafür, wer welchen Vorgang bearbeitet, und liefert diese Beziehung an den Entscheidungspunkt","Zaken toewijzen en rollen per zaaktype inrichten.":"Vorgänge zuweisen und Rollen je Vorgangstyp einrichten.","Zoekportaal (TINA)":"Suchportal (TINA)","Aparte omgeving in Keycloak, met DigiD":"Eigener Bereich in Keycloak, mit DigiD","Geen rollen: inwoners staan niet in Saviynt":"Keine Rollen: Einwohner stehen nicht in Saviynt","Eigen stukken en openbare stukken":"Eigene und öffentliche Dokumente","Van RBAC naar beleid":"Von RBAC zu Richtlinien","Geen keuze voor één model: beleid combineert ze. De overstap kan per systeem, zonder dat de toepassing verandert.":"Keine Entscheidung für ein Modell: Richtlinien kombinieren sie. Der Umstieg kann je System erfolgen, ohne dass sich die Anwendung ändert.","Model":"Modell","Wat beslist":"Was entscheidet","Sterk":"Stärken","Zwak":"Schwächen","RBAC":"RBAC","De rol van de persoon":"Die Rolle der Person","Eenvoudig, en goed te herzien in Saviynt":"Einfach und gut in Saviynt zu überprüfen","Grof: een rol geeft toegang tot alles van een soort. Rollen stapelen, en elke uitzondering wordt een nieuwe rol.":"Grob: Eine Rolle gibt Zugriff auf alles einer Art. Rollen häufen sich, und jede Ausnahme wird eine neue Rolle.","ABAC":"ABAC","Eigenschappen van persoon, stuk en situatie":"Attribute von Person, Dokument und Situation","Fijnmazig zonder een explosie van rollen; volgt de metadata":"Feingranular ohne Rollenexplosion; folgt den Metadaten","Vraagt betrouwbare metadata. Een besluit is lastiger uit te leggen.":"Erfordert verlässliche Metadaten. Eine Entscheidung ist schwerer zu erklären.","ReBAC":"ReBAC","De relatie tussen persoon en stuk, zoals behandelaar van een zaak":"Die Beziehung zwischen Person und Dokument, etwa Bearbeitung eines Vorgangs","Past bij zaakgericht werken; de relaties komen uit het zaaksysteem":"Passt zur vorgangsbezogenen Arbeit; die Beziehungen kommen aus dem Vorgangsbearbeitungssystem","Vraagt een actuele kopie van die relaties, of een snelle bevraging.":"Erfordert eine aktuelle Kopie dieser Beziehungen oder eine schnelle Abfrage.","PBAC":"PBAC","Beleid als code dat rol, eigenschappen en relaties combineert":"Richtlinien als Code, die Rolle, Attribute und Beziehungen kombinieren","Eén plek voor de regels, te testen, met een reden bij elk besluit":"Eine Stelle für die Regeln, testbar, mit Begründung zu jeder Entscheidung","Een extra onderdeel bij elke aanvraag. Beschikbaarheid en snelheid worden kritiek.":"Ein zusätzlicher Baustein bei jeder Anfrage. Verfügbarkeit und Geschwindigkeit werden kritisch.","Ontwerpregels":"Entwurfsregeln","Rollen veranderen alleen in Saviynt. Wie in Keycloak of in een toepassing met de hand iets wijzigt, ziet het bij de volgende synchronisatie verdwijnen.":"Rollen ändern sich nur in Saviynt. Wer in Keycloak oder in einer Anwendung von Hand etwas ändert, sieht es bei der nächsten Synchronisation verschwinden.","Tokens zijn kort geldig, vijf minuten. Intrekken werkt dan ook voor systemen die geen melding verwerken.":"Tokens gelten kurz, fünf Minuten. So wirkt ein Entzug auch bei Systemen, die keine Meldung verarbeiten.","Een assistent of een automatisch proces heeft een eigen identiteit, met zo weinig rechten als kan. Handelt het namens een medewerker, dan met diens token.":"Ein Assistent oder ein automatisierter Prozess hat eine eigene Identität, mit so wenig Rechten wie möglich. Handelt er im Namen von Beschäftigten, dann mit deren Token.","Elk besluit heeft een reden, en die komt in het auditlog.":"Jede Entscheidung hat eine Begründung, und die kommt ins Audit-Log.","Inwoners en medewerkers staan in aparte omgevingen. Een fout in de een raakt de ander niet.":"Einwohner und Beschäftigte stehen in getrennten Bereichen. Ein Fehler im einen trifft den anderen nicht.","Standaarden":"Standards","SCIM 2.0":"SCIM 2.0","RFC 7643 en 7644":"RFC 7643 und 7644","Accounts en groepen aanmaken, wijzigen en opheffen. Keycloak krijgt een SCIM-server, experimenteel vanaf versie 26.6.":"Konten und Gruppen anlegen, ändern und löschen. Keycloak erhält einen SCIM-Server, experimentell ab Version 26.6.","OpenID NLGov-profiel (Logius)":"OpenID-NLGov-Profil (Logius)","Aanmelden en identiteitstokens.":"Anmeldung und Identitätstokens.","OAuth 2.0":"OAuth 2.0","NL GOV Assurance profile (Logius)":"NL GOV Assurance profile (Logius)","Tokens voor API's binnen de overheid.":"Tokens für APIs innerhalb der Verwaltung.","RFC 8693":"RFC 8693","Een assistent handelt namens de medewerker, met diens rechten.":"Ein Assistent handelt im Namen der Beschäftigten, mit deren Rechten.","AuthZEN":"AuthZEN","Authorization API 1.0, OpenID Foundation, definitief sinds januari 2026":"Authorization API 1.0, OpenID Foundation, final seit Januar 2026","Eén interface tussen handhavingspunt en beslispunt. Het beslispunt is zo te vervangen.":"Eine Schnittstelle zwischen Durchsetzungspunkt und Entscheidungspunkt. So ist der Entscheidungspunkt austauschbar.","Shared Signals en CAEP":"Shared Signals und CAEP","OpenID Foundation, definitief sinds september 2025":"OpenID Foundation, final seit September 2025","Een melding bij intrekking, direct naar elk systeem. In Keycloak nog experimenteel.":"Eine Meldung beim Entzug, direkt an jedes System. In Keycloak noch experimentell.","OAUTHBEARER":"OAUTHBEARER","RFC 7628":"RFC 7628","Aanmelden bij IMAP met een token in plaats van een wachtwoord.":"Anmeldung bei IMAP mit einem Token statt eines Passworts.","BIO":"BIO","Baseline Informatiebeveiliging Overheid, op basis van ISO 27002":"Baseline Informatiebeveiliging Overheid (niederländischer IT-Sicherheitsstandard der Verwaltung), auf Basis von ISO 27002","Toegangsbeheer: identiteiten, rechten en het herzien ervan.":"Zugangssteuerung: Identitäten, Berechtigungen und deren Überprüfung.","Passkeys":"Passkeys","W3C WebAuthn en FIDO2":"W3C WebAuthn und FIDO2","Een tweede factor die niet afhangt van één leverancier.":"Ein zweiter Faktor, der nicht von einem einzelnen Anbieter abhängt.","Van handwerk naar beleid":"Von Handarbeit zu Richtlinien","Concept. Dit is een volgorde, geen planning. Elke stap levert iets op, en geen stap vraagt dat een toepassing anders gaat werken voor de medewerker.":"Entwurf. Dies ist eine Reihenfolge, kein Zeitplan. Jeder Schritt bringt etwas, und kein Schritt verlangt, dass eine Anwendung für die Beschäftigten anders funktioniert.","stap {0}":"Schritt {0}","Zelf te doen":"Selbst machbar","Rolcatalogus voor de demo-systemen":"Rollenkatalog für die Demo-Systeme","eerst":"zuerst","Wat functioneel beheer merkt":"Was die Fachadministration merkt","Een inventaris van de rollen in elk systeem, en per functie welke rollen erbij horen.":"Eine Bestandsaufnahme der Rollen in jedem System und je Funktion, welche Rollen dazugehören.","Wat het platform moet kunnen":"Was die Plattform können muss","Niets nieuws. Saviynt leest de bestaande rollen in.":"Nichts Neues. Saviynt liest die bestehenden Rollen ein.","Wat het van leveranciers vraagt":"Was es von Anbietern verlangt","Medewerking van functioneel beheer en de teamleiders.":"Mitwirkung der Fachadministration und der Teamleitungen.","Per functie een set geboorterechten, vastgesteld door de leidinggevenden.":"Je Funktion ein Satz Basisberechtigungen, festgelegt von den Führungskräften.","Aanmelden via Keycloak":"Anmeldung über Keycloak","daarna":"danach","Geen accounts meer aanmaken: systemen maken ze zelf bij de eerste aanmelding, met de rollen uit het token.":"Keine Konten mehr anlegen: Die Systeme legen sie bei der ersten Anmeldung selbst an, mit den Rollen aus dem Token.","Keycloak hoog beschikbaar, met Entra ID als identiteitsbron erachter. Elk systeem gebruikt OpenID Connect.":"Keycloak hochverfügbar, mit Entra ID als Identitätsquelle dahinter. Jedes System nutzt OpenID Connect.","Systemen die OpenID Connect ondersteunen, met rollen uit claims.":"Systeme, die OpenID Connect unterstützen, mit Rollen aus Claims.","Alle demo-systemen melden aan via Keycloak.":"Alle Demo-Systeme melden über Keycloak an.","Saviynt provisioneert":"Saviynt provisioniert","In dienst, overstap en uit dienst gaan vanzelf. Geen tickets meer per systeem voor de geboorterechten.":"Eintritt, Wechsel und Austritt laufen von selbst. Keine Tickets mehr je System für die Basisberechtigungen.","Koppelingen van Saviynt naar Entra ID en Keycloak. Uit dienst binnen vijf minuten, met beëindigde sessies.":"Anbindungen von Saviynt an Entra ID und Keycloak. Austritt innerhalb von fünf Minuten, mit beendeten Sitzungen.","Een betrouwbare koppeling met Keycloak; de connector van Saviynt is een communityversie.":"Eine verlässliche Anbindung an Keycloak; der Connector von Saviynt ist eine Community-Version.","Geen slapende accounts meer in de demo-systemen.":"Keine verwaisten Konten mehr in den Demo-Systemen.","Aanvragen en herzien":"Beantragen und überprüfen","Extra rechten, zoals zegelbevoegd of een gedeelde postbus, gaan via een aanvraag met goedkeuring. Elk halfjaar herzien.":"Zusätzliche Berechtigungen, etwa „siegelbefugt“ oder ein gemeinsames Postfach, laufen über einen Antrag mit Genehmigung. Jedes Halbjahr überprüft.","Werkstromen in Saviynt, met functiescheiding.":"Workflows in Saviynt, mit Funktionstrennung.","Niets bijzonders.":"Nichts Besonderes.","Elke extra bevoegdheid heeft een goedkeurder en een herziening.":"Jede zusätzliche Befugnis hat einen Genehmigenden und eine Überprüfung.","Besluiten naar het beslispunt":"Entscheidungen an den Entscheidungspunkt","Nog niets: de regels van nu gaan één op één over naar beleid als code, eerst alleen meekijkend.":"Noch nichts: Die heutigen Regeln gehen eins zu eins in Richtlinien als Code über, zunächst nur mitlaufend.","Het register als handhavingspunt, met AuthZEN. Het beslispunt draait naast het register.":"Das Register als Durchsetzungspunkt, mit AuthZEN. Der Entscheidungspunkt läuft neben dem Register.","Een beslispunt dat AuthZEN spreekt.":"Ein Entscheidungspunkt, der AuthZEN spricht.","Het beslispunt neemt dezelfde besluiten als de systemen zelf, aantoonbaar.":"Der Entscheidungspunkt trifft nachweislich dieselben Entscheidungen wie die Systeme selbst.","Eigenschappen en relaties":"Attribute und Beziehungen","ACL's verdwijnen. Toegang volgt uit de vertrouwelijkheid van het stuk en de relatie met de zaak.":"ACLs verschwinden. Der Zugriff ergibt sich aus der Vertraulichkeit des Dokuments und der Beziehung zum Vorgang.","Classificatie uit de Office Assistent in het register; de behandelaar uit het zaaksysteem.":"Klassifizierung aus dem Office-Assistenten im Register; die zuständige Sachbearbeitung aus dem Vorgangsbearbeitungssystem.","Een zaaksysteem dat de relatie met een zaak snel kan geven.":"Ein Vorgangsbearbeitungssystem, das die Beziehung zu einem Vorgang schnell liefern kann.","Geen ACL's meer in XENA en de Nextcloud-stack.":"Keine ACLs mehr in XENA und im Nextcloud-Stack.","Afhankelijk van de markt":"Abhängig vom Markt","Meldingen bij intrekken":"Meldungen beim Entzug","later":"später","Niets: intrekken gaat nog sneller, ook bij een verloren laptop.":"Nichts: Der Entzug geht noch schneller, auch bei einem verlorenen Laptop.","Shared Signals en CAEP tussen Keycloak en de systemen.":"Shared Signals und CAEP zwischen Keycloak und den Systemen.","Stabiele ondersteuning in Keycloak en in de systemen.":"Stabile Unterstützung in Keycloak und in den Systemen.","Een ingetrokken sessie stopt in seconden, overal.":"Eine entzogene Sitzung endet in Sekunden, überall.","Identiteitsbron vervangbaar":"Austauschbare Identitätsquelle","Een andere manier van aanmelden, bijvoorbeeld met een passkey. Verder niets.":"Eine andere Art der Anmeldung, etwa mit einem Passkey. Sonst nichts.","Een andere identiteitsbron achter Keycloak; samenwerking met Zandvoort via federatie.":"Eine andere Identitätsquelle hinter Keycloak; Zusammenarbeit mit Zandvoort über Föderation.","Een alternatief voor Entra ID dat Saviynt kan voeden.":"Eine Alternative zu Entra ID, die Saviynt beliefern kann.","Entra ID is te vervangen zonder dat een systeem verandert.":"Entra ID ist austauschbar, ohne dass sich ein System ändert.","Waarom met de demo-systemen beginnen":"Warum mit den Demo-Systemen beginnen","Ze zijn nieuw of worden nieuw ingericht. Er is geen erfenis van ACL's om op te ruimen.":"Sie sind neu oder werden neu eingerichtet. Es gibt kein Erbe an ACLs aufzuräumen.","Ze delen één register. Eén handhavingspunt dekt opslag, e-mail, chat en zegels.":"Sie teilen ein Register. Ein Durchsetzungspunkt deckt Speicher, E-Mail, Chat und Siegel ab.","Wat werkt, is daarna een voorbeeld voor het zaaksysteem en de andere applicaties.":"Was funktioniert, ist danach ein Vorbild für das Vorgangsbearbeitungssystem und die anderen Anwendungen.","Waar het kan schuren":"Wo es haken kann","Een rolmodel vraagt dat teamleiders vastleggen wat bij een functie hoort. Dat is organisatiewerk, geen techniek.":"Ein Rollenmodell verlangt, dass Teamleitungen festlegen, was zu einer Funktion gehört. Das ist Organisationsarbeit, keine Technik.","Wie gewend is rechten te kopiëren van een collega, ervaart een aanvraag met goedkeuring als trager.":"Wer es gewohnt ist, Berechtigungen von Kollegen zu kopieren, empfindet einen Antrag mit Genehmigung als langsamer.","Beleid op eigenschappen werkt alleen met geclassificeerde stukken. Oude stukken zonder classificatie vallen terug op de regels van nu.":"Attributbasierte Richtlinien funktionieren nur mit klassifizierten Dokumenten. Ältere Dokumente ohne Klassifizierung fallen auf die heutigen Regeln zurück.","IRIS laat zien hoe gebruikersbeheer voor de systemen uit de demo's te automatiseren is: van het personeelsdossier tot het besluit op een stuk. Voor IT-beheer, security en architecten.":"IRIS zeigt, wie sich die Benutzerverwaltung für die Systeme aus den Demos automatisieren lässt: von der Personalakte bis zur Entscheidung über ein Dokument. Für IT-Betrieb, Security und Architekten.","Weergaven":"Ansichten","In dienst, overstap, extra bevoegdheid, uit dienst en samenwerking: stap voor stap, nu met de hand en straks geautomatiseerd.":"Eintritt, Wechsel, zusätzliche Befugnis, Austritt und Zusammenarbeit: Schritt für Schritt, heute manuell und künftig automatisiert.","Open deze weergave":"Diese Ansicht öffnen","Kies een persoon, een stuk en een handeling. Zie het besluit van nu naast dat van een beleidsbeslispunt, met de AuthZEN-vraag erbij.":"Wählen Sie eine Person, ein Dokument und eine Aktion. Sehen Sie die heutige Entscheidung neben der eines Richtlinienentscheidungspunkts, samt AuthZEN-Anfrage.","De lagen van personeelsdossier tot toegang, en de stappen bij aanmelden, handelen namens, beslissen, uit dienst en herzien.":"Die Schichten von der Personalakte bis zum Zugriff und die Schritte bei Anmeldung, Handeln im Auftrag, Entscheiden, Austritt und Überprüfung.","Componenten, de koppeling per systeem uit de demo's, de modellen van RBAC tot beleid, ontwerpregels en standaarden.":"Komponenten, die Anbindung je System aus den Demos, die Modelle von RBAC bis zu Richtlinien, Entwurfsregeln und Standards.","Acht stappen, beginnend met een rolcatalogus voor de demo-systemen.":"Acht Schritte, beginnend mit einem Rollenkatalog für die Demo-Systeme.","Makers, licentie en contact staan in het colofon, onder de titel.":"Urheber, Lizenz und Kontakt stehen im Impressum, unter dem Titel.","Colofon openen":"Impressum öffnen","De schakelaar":"Der Schalter","Nu, met de hand per systeem, of straks, geautomatiseerd. De situatie verandert de stappen in Levenscyclus en de autorisatielaag in Architectuur.":"Heute, manuell je System, oder künftig, automatisiert. Die Situation ändert die Schritte in Lebenszyklus und die Autorisierungsschicht in Architektur.","De regel onderaan toont wat er technisch gebeurt bij een handeling.":"Die Zeile unten zeigt, was bei einer Aktion technisch geschieht.","Veelgestelde vragen":"Häufige Fragen","Zoek in de vragen":"In den Fragen suchen","Begrippen":"Begriffe","Wat is het verschil tussen Saviynt en Keycloak?":"Was ist der Unterschied zwischen Saviynt und Keycloak?","Saviynt bepaalt wie wat mag en waarom: rollen, aanvragen, herzieningen. Keycloak voert het uit bij elke aanmelding: sessies en tokens. Rollen veranderen in Saviynt, nooit in Keycloak.":"Saviynt bestimmt, wer was darf und warum: Rollen, Anträge, Überprüfungen. Keycloak setzt es bei jeder Anmeldung um: Sitzungen und Tokens. Rollen ändern sich in Saviynt, nie in Keycloak.","Waarom Keycloak tussen Entra ID en de systemen?":"Warum Keycloak zwischen Entra ID und den Systemen?","Zodat de systemen niet aan Entra ID vastzitten. Wordt Entra ID vervangen, dan verandert alleen de koppeling achter Keycloak.":"Damit die Systeme nicht an Entra ID gebunden sind. Wird Entra ID ersetzt, ändert sich nur die Anbindung hinter Keycloak.","Wat is een geboorterecht?":"Was ist eine Basisberechtigung?","De rechten die iemand krijgt door zijn functie, zonder aanvraag. Alles daarboven is een extra recht, met een aanvraag, een goedkeurder en een herziening.":"Die Berechtigungen, die jemand durch die Funktion erhält, ohne Antrag. Alles darüber hinaus ist eine zusätzliche Berechtigung, mit Antrag, Genehmigendem und Überprüfung.","Beheer":"Administration","Verdwijnt het werk van functioneel beheer?":"Verschwindet die Arbeit der Fachadministration?","Het handwerk wel: accounts aanmaken en rechten toekennen per ticket. Wat blijft, is inhoudelijk: rollen koppelen, zaken toewijzen, het beleid mee opstellen en uitzonderingen beoordelen.":"Die Handarbeit schon: Konten anlegen und Berechtigungen per Ticket vergeben. Was bleibt, ist inhaltlich: Rollen zuordnen, Vorgänge zuweisen, die Richtlinien mit erarbeiten und Ausnahmen beurteilen.","Wie beslist wie zegelbevoegd is?":"Wer entscheidet, wer siegelbefugt ist?","De gemeentesecretaris, via een aanvraag in Saviynt. De zegeldienst kijkt alleen naar de rol in het token.":"Der Gemeindesekretär, über einen Antrag in Saviynt. Der Siegeldienst schaut nur auf die Rolle im Token.","Beveiliging":"Sicherheit","Hoe snel is iemand die vertrekt eruit?":"Wie schnell ist jemand, der geht, draußen?","Op het geplande moment gaat het account uit en eindigen alle sessies. Tokens zijn vijf minuten geldig, dus binnen vijf minuten werkt niets meer.":"Zum geplanten Zeitpunkt wird das Konto deaktiviert und alle Sitzungen enden. Tokens gelten fünf Minuten, also funktioniert nach spätestens fünf Minuten nichts mehr.","Heeft de Office Assistent eigen rechten?":"Hat der Office-Assistent eigene Rechte?","Nee. De assistent handelt altijd namens de medewerker, met een ingeruild token. Wat de medewerker niet mag, kan de assistent ook niet.":"Nein. Der Assistent handelt immer im Namen der Beschäftigten, mit einem getauschten Token. Was die Beschäftigten nicht dürfen, kann auch der Assistent nicht.","Mag een beheerder alles zien?":"Darf ein Administrator alles sehen?","Een beheerder ziet de metadata. De inhoud alleen met een vastgelegde reden en een melding aan security.":"Ein Administrator sieht die Metadaten. Den Inhalt nur mit festgehaltener Begründung und einer Meldung an die Security.","Neemt IAM de rechten van het zaaksysteem over?":"Übernimmt IAM die Berechtigungen des Vorgangsbearbeitungssystems?","Nee. Het zaaksysteem blijft leidend voor wie welke zaak behandelt. Het beslispunt vraagt die relatie op.":"Nein. Das Vorgangsbearbeitungssystem bleibt maßgeblich dafür, wer welchen Vorgang bearbeitet. Der Entscheidungspunkt fragt diese Beziehung ab.","Modellen":"Modelle","Moeten we meteen naar ABAC?":"Müssen wir sofort zu ABAC?","Nee. Eerst gaan de regels van nu één op één naar het beslispunt. Daarna komen eigenschappen en relaties erbij, per soort stuk.":"Nein. Zuerst gehen die heutigen Regeln eins zu eins an den Entscheidungspunkt. Danach kommen Attribute und Beziehungen hinzu, je Dokumentart.","Inwoners":"Einwohner","Staan inwoners ook in Saviynt?":"Stehen Einwohner auch in Saviynt?","Nee. Inwoners melden zich aan met DigiD in een aparte omgeving van Keycloak, en krijgen alleen hun eigen stukken en openbare stukken.":"Nein. Einwohner melden sich mit DigiD in einem eigenen Bereich von Keycloak an und erhalten nur ihre eigenen und öffentliche Dokumente.","IAM":"IAM","Identity and access management: wie iemand is en wat die mag.":"Identity and Access Management: wer jemand ist und was er darf.","IGA":"IGA","Identity governance and administration: het beheer van rechten, met aanvragen, goedkeuring en herziening.":"Identity Governance and Administration: die Verwaltung von Berechtigungen, mit Anträgen, Genehmigung und Überprüfung.","Geboorterecht":"Basisberechtigung","Recht dat bij een functie hoort, zonder aanvraag.":"Berechtigung, die zu einer Funktion gehört, ohne Antrag.","Rechtenstapeling":"Rechteanhäufung","Rechten die zich opstapelen omdat oude niet worden ingetrokken.":"Berechtigungen, die sich anhäufen, weil alte nicht entzogen werden.","Het periodiek herzien van rechten door de leidinggevende.":"Die regelmäßige Überprüfung von Berechtigungen durch die Führungskraft.","Combinaties van rechten die niet bij één persoon mogen liggen.":"Kombinationen von Berechtigungen, die nicht bei einer Person liegen dürfen.","Toegang op grond van een rol.":"Zugriff auf Grundlage einer Rolle.","Toegang op grond van eigenschappen van persoon, stuk en situatie.":"Zugriff auf Grundlage von Attributen von Person, Dokument und Situation.","Toegang op grond van een relatie, zoals behandelaar van een zaak.":"Zugriff auf Grundlage einer Beziehung, etwa Bearbeitung eines Vorgangs.","Toegang op grond van beleid als code, dat de andere combineert.":"Zugriff auf Grundlage von Richtlinien als Code, die die anderen kombinieren.","Het onderdeel dat besluit of iets mag (PDP).":"Der Baustein, der entscheidet, ob etwas erlaubt ist (PDP).","Handhavingspunt":"Durchsetzungspunkt","Het onderdeel dat het besluit uitvoert (PEP).":"Der Baustein, der die Entscheidung durchsetzt (PEP).","Standaard voor de vraag van handhavingspunt aan beslispunt.":"Standard für die Anfrage des Durchsetzungspunkts an den Entscheidungspunkt.","SCIM":"SCIM", rs, movers and leavers","Kies een gebeurtenis. Zet bovenaan Nu of Straks om te zien wat er verandert voor functioneel beheer, en wat er achterblijft.":"Choose an event. Switch between Now and Soon at the top to see what changes for application management, and what is left behind.","Gebeurtenis":"Event","In dienst":"Joiner","Daan Visser begint als vergunningverlener bij Team Vergunningen.":"Daan Visser starts as a permit officer in the Permits Team.","Interne overstap":"Internal mover","Sanne de Vries gaat van Team Vergunningen naar Team Handhaving.":"Sanne de Vries moves from the Permits Team to the Enforcement Team.","Extra bevoegdheid":"Additional authorisation","Ilse Mulder van de griffie wordt zegelbevoegd.":"Ilse Mulder of the council clerk's office becomes authorised to seal.","Uit dienst":"Leaver","Noor Bakker vertrekt per 1 december.":"Noor Bakker leaves on 1 December.","Samenwerking":"Collaboration","Een collega van Zandvoort werkt mee aan een gezamenlijk dossier.":"A colleague from Zandvoort works on a joint dossier.","straks, geautomatiseerd":"soon, automated","Speel af":"Play","HR-systeem":"HR system","dag −14":"day −14","HR legt de indiensttreding vast.":"HR records the new joiner.","Saviynt":"Saviynt","minuten":"minutes","Saviynt leest de wijziging en kent de geboorterechten toe die bij de functie vergunningverlener horen.":"Saviynt reads the change and grants the birthright access that comes with the permit officer job.","Entra ID":"Entra ID","Saviynt maakt het account aan in Entra ID. De tweede factor stelt Daan in op de eerste werkdag.":"Saviynt creates the account in Entra ID. Daan sets up the second factor on the first working day.","Keycloak":"Keycloak","Saviynt zet Daan in de groepen in Keycloak: medewerker, Team Vergunningen, vergunningverlener.":"Saviynt adds Daan to the groups in Keycloak: employee, Permits Team, permit officer.","Toepassingen":"Applications","eerste aanmelding":"first sign-in","Bij de eerste aanmelding maakt elk systeem het account zelf aan uit het token, met de rollen die erin staan. Geen ticket per systeem.":"At the first sign-in, each system creates the account itself from the token, with the roles it contains. No ticket per system.","Zaaksysteem":"Case management system","eerste werkdag":"first working day","Welke zaken Daan behandelt, bepaalt de teamleider in het zaaksysteem, zoals nu.":"Which cases Daan handles is decided by the team leader in the case management system, as it is now.","Nu":"Now","met de hand":"manual","Handelingen door mensen":"Manual actions","Klaar":"Done","twee werkdagen na de start":"two working days after the start","Wat achterblijft":"What is left behind","Rechten gekopieerd van een collega: vaak meer dan nodig.":"Access rights copied from a colleague: often more than needed.","Straks":"Soon","geautomatiseerd":"automated","op de eerste werkdag":"on the first working day","Alleen wat bij de functie hoort; extra rechten via een aanvraag.":"Only what comes with the job; additional rights via a request.","Wat functioneel beheer niet meer doet":"What application management no longer does","Accounts aanmaken en opheffen, per systeem.":"Creating and removing accounts, system by system.","Rechten toekennen op grond van een formulier of een mail.":"Granting rights based on a form or an email.","Rechten kopiëren van een collega.":"Copying rights from a colleague.","Lijsten bijhouden van wie wat mag, in configuratiebestanden.":"Maintaining lists of who may do what, in configuration files.","Wat blijft":"What remains","Per systeem één keer de eigen rollen koppelen aan de groepen in Keycloak.":"Mapping each system's own roles to the groups in Keycloak, once.","Zaken toewijzen in het zaaksysteem: dat blijft het zaaksysteem.":"Assigning cases in the case management system: that stays with the case management system.","Het beleid mee opstellen en testen, samen met informatiebeheer en security.":"Helping to draft and test the policy, together with records management and security.","Uitzonderingen beoordelen die buiten het beleid vallen.":"Assessing exceptions that fall outside the policy.","Onder de motorkap":"Under the bonnet","demo versie {0}, {1}":"demo version {0}, {1}","Onderdeel van XENA, naast de opslag, MIRA, TINA, ELSA, MAIA en VERA.":"Part of XENA, alongside storage, MIRA, TINA, ELSA, MAIA and VERA.","Personen en stukken zijn verzonnen.":"People and documents are fictitious.","Situatie: nu, met de hand per systeem":"Situation: now, manually per system","Functioneel beheerders houden de rechten in elk systeem met de hand bij.":"Application administrators maintain the access rights in each system by hand.","nu, met de hand":"now, manual","HR legt de indiensttreding vast, twee weken van tevoren.":"HR records the new joiner, two weeks in advance.","Servicedesk":"Service desk","dag −10":"day −10","De leidinggevende vult een formulier in bij de servicedesk: account, mailbox, toegang tot de systemen.":"The manager fills in a form at the service desk: account, mailbox, access to the systems.","dag −5":"day −5","De servicedesk maakt het account aan in Entra ID en zet het in de groepen die op het formulier staan.":"The service desk creates the account in Entra ID and adds it to the groups listed on the form.","Functioneel beheer":"Application management","dag −3 tot +2":"day −3 to +2","Per systeem een ticket. Het zaaksysteem, de Nextcloud-stack, het mailarchief: elke functioneel beheerder kent de rechten met de hand toe, vaak door die van een collega te kopiëren.":"One ticket per system. The case management system, the Nextcloud stack, the mail archive: each application administrator grants the rights by hand, often by copying a colleague's.","dag +2":"day +2","Op de eerste werkdag werkt het meeste. Een vergeten systeem volgt na een nieuw ticket.":"Most things work on the first working day. A forgotten system follows after another ticket.","Ticket bij de servicedesk · e-mail aan functioneel beheer · handmatige wijziging per systeem":"Ticket at the service desk · email to application management · manual change per system","Situatie: straks, geautomatiseerd":"Situation: soon, automated","dag 0":"day 0","HR legt de nieuwe functie vast.":"HR records the new job.","dag 1":"day 1","De nieuwe leidinggevende vraagt de nieuwe rechten aan. Om het intrekken van de oude vraagt niemand.":"The new manager requests the new rights. Nobody asks for the old ones to be revoked.","dag 2 tot 5":"days 2 to 5","De functioneel beheerders geven de rollen van Handhaving. De rol vergunningverlener blijft staan, net als de teammap van Vergunningen.":"The application administrators grant the Enforcement roles. The permit officer role stays in place, as does the Permits team folder.","weken":"weeks","Haar open zaken staan nog op haar naam.":"Her open cases are still in her name.","maanden":"months","Na een jaar heeft Sanne de rechten van twee teams. Dat valt pas op bij een audit.":"After a year, Sanne has the rights of two teams. Nobody notices until an audit.","een week":"one week","Oude rechten blijven staan: rechtenstapeling.":"Old rights stay in place: privilege creep.","dezelfde dag":"the same day","Geen oude rechten; extra rechten alleen als de leidinggevende ze bevestigt.":"No old rights; additional rights only if the manager confirms them.","Saviynt ziet de overstap: de geboorterechten van Vergunningen gaan eraf, die van Handhaving komen erbij. Extra rechten die ze had, legt Saviynt voor aan de nieuwe leidinggevende: houden of intrekken.":"Saviynt detects the move: the Permits birthright access is removed, the Enforcement birthright access is added. Any additional rights she had are put to the new manager: keep or revoke.","binnen 5 minuten":"within 5 minutes","De groepen in Keycloak veranderen. Bij de volgende vernieuwing van het token kloppen de rollen in elk systeem.":"The groups in Keycloak change. At the next token refresh, the roles are correct in every system.","Beleidsbeslispunt":"Policy decision point","direct":"immediately","Toegang tot stukken van Team Vergunningen hangt af van het team in het token. Daarvoor hoeft niemand een ACL aan te passen.":"Access to Permits Team documents depends on the team in the token. Nobody has to change an ACL for that.","Het zaaksysteem meldt de open zaken van Sanne aan de teamleider van Vergunningen, om opnieuw toe te wijzen. Dat blijft een besluit van mensen.":"The case management system reports Sanne's open cases to the Permits team leader for reassignment. That remains a human decision.","Leidinggevende":"Manager","De griffier mailt de servicedesk dat Ilse zegelbevoegd moet worden.":"The council clerk emails the service desk that Ilse should become authorised to seal.","dag 3":"day 3","De beheerder van de zegeldienst zet Ilse in een lijst in de configuratie.":"The sealing service administrator adds Ilse to a list in the configuration.","—":"—","Niemand legt vast wie het goedkeurde, of wanneer het weer moet vervallen.":"Nobody records who approved it, or when it should expire.","drie werkdagen":"three working days","Geen spoor van de goedkeuring en geen herziening.":"No trace of the approval and no review.","één werkdag":"one working day","Wie, waarom en tot wanneer: vastgelegd en herzien.":"Who, why and until when: recorded and reviewed.","De griffier vraagt in Saviynt de bevoegdheid zegelbevoegd aan voor Ilse, met een reden.":"The council clerk requests the authorised-to-seal entitlement for Ilse in Saviynt, with a reason.","Saviynt controleert de functiescheiding: wie de zegeldienst beheert, mag niet zelf zegelen.":"Saviynt checks segregation of duties: whoever administers the sealing service may not seal themselves.","Gemeentesecretaris":"Municipal secretary","De gemeentesecretaris keurt goed. De bevoegdheid komt elk halfjaar terug in de hercertificering.":"The municipal secretary approves. The entitlement comes up every six months in the recertification.","Ilse komt in de groep zegelbevoegd. Haar token draagt die rol.":"Ilse is added to the authorised-to-seal group. Her token carries that role.","volgende aanmelding":"next sign-in","In het paneel van de Office Assistent ziet Ilse nu de knop Zegel. De zegeldienst controleert de rol en vraagt bij elk zegel de tweede factor.":"In the Office Assistant panel, Ilse now sees the Seal button. The sealing service checks the role and asks for the second factor for every seal.","dag −20":"day −20","HR legt de uitdiensttreding vast.":"HR records the leaver.","Op de laatste dag blokkeert de servicedesk het account in Entra ID.":"On the last day, the service desk blocks the account in Entra ID.","uren tot dagen":"hours to days","Sessies die openstaan, blijven werken tot ze verlopen. Lokale accounts in systemen die niet aan Entra ID hangen, blijven bestaan.":"Open sessions keep working until they expire. Local accounts in systems not connected to Entra ID remain in place.","Per systeem moet een functioneel beheerder het account opheffen. Dat gebeurt als iemand eraan denkt.":"For each system, an application administrator has to remove the account. That happens when someone remembers.","Stukken die alleen op naam van Noor staan, zijn voor niemand meer te vinden.":"Documents held only in Noor's name can no longer be found by anyone.","Slapende accounts en stukken zonder eigenaar.":"Dormant accounts and documents without an owner.","Geen slapende accounts; elk stuk heeft een eigenaar.":"No dormant accounts; every document has an owner.","Saviynt plant het intrekken op de laatste werkdag om 17:00 en vraagt de leidinggevende wie haar stukken en taken overneemt.":"Saviynt schedules the revocation for 17:00 on the last working day and asks the manager who takes over her documents and tasks.","17:00":"17:00","Op het moment zelf: account uit in Entra ID en Keycloak, alle sessies beëindigd, en een melding aan elk systeem.":"At that moment: account disabled in Entra ID and Keycloak, all sessions ended, and a notification to every system.","Elk systeem trekt de toegang direct in. Tokens die nog bestaan, verlopen binnen vijf minuten.":"Each system revokes access immediately. Any remaining tokens expire within five minutes.","XENA-register":"XENA register","Het register zet haar stukken op naam van het team. Persoonlijke e-mail blijft afgeschermd; alleen de gemeentesecretaris kan daar toegang toe verlenen.":"The register transfers her documents to the team. Personal email stays shielded; only the municipal secretary can grant access to it.","Haarlem maakt een tweede account voor de collega, met een eigen wachtwoord.":"Haarlem creates a second account for the colleague, with a separate password.","dag 2":"day 2","De functioneel beheerder geeft toegang tot het dossier.":"The application administrator grants access to the dossier.","Als de collega bij Zandvoort vertrekt, weet Haarlem van niets.":"If the colleague leaves Zandvoort, Haarlem is none the wiser.","twee werkdagen":"two working days","Een account dat niemand beheert.":"An account nobody manages.","Geen tweede account; de toegang vervalt vanzelf.":"No second account; access expires automatically.","Keycloak vertrouwt de identiteitsdienst van Zandvoort. De collega meldt zich aan met het eigen account.":"Keycloak trusts Zandvoort's identity provider. The colleague signs in with their own account.","De dossiereigenaar in Haarlem vraagt in Saviynt toegang aan voor de collega, voor dit dossier en met een einddatum.":"The dossier owner in Haarlem requests access for the colleague in Saviynt, for this dossier and with an end date.","Het beleid geeft toegang tot het gezamenlijke dossier, en tot niets anders.":"The policy grants access to the joint dossier, and to nothing else.","Vertrekt de collega bij Zandvoort, dan werkt de aanmelding niet meer. Op de einddatum vervalt de toegang vanzelf.":"If the colleague leaves Zandvoort, the sign-in stops working. On the end date, access expires automatically.","Opnieuw afspelen":"Replay","Team Vergunningen":"Permits Team","Vergunningverlener, sinds deze week":"Permit officer, since this week","medewerker":"employee","vergunningverlener":"permit officer","Zaakvertrouwelijk":"Case-confidential","In behandeling":"In progress","In een lopende zaak wijzigt alleen de behandelaar de stukken.":"In an ongoing case, only the case handler edits the documents.","Wie mag wat met dit stuk?":"Who may do what with this document?","Kies een persoon, een stuk en een handeling. Links het besluit zoals de systemen het nu nemen, met rollen en ACL's. Rechts het besluit van een beleidsbeslispunt dat ook naar het stuk en de zaak kijkt.":"Choose a person, a document and an action. On the left, the decision as the systems take it now, with roles and ACLs. On the right, the decision of a policy decision point that also looks at the document and the case.","Persoon":"Person","Functie":"Job","Team":"Team","Rollen":"Roles","Saviynt, in het token van Keycloak":"Saviynt, in the Keycloak token","Stuk":"Document","Aanvraag omgevingsvergunning Hoge Weide":"Environmental permit application Hoge Weide","Besluit omgevingsvergunning Hoge Weide":"Environmental permit decision Hoge Weide","Raadsvoorstel zonnepark Spaarnwoude":"Council proposal Spaarnwoude solar park","Persoonlijk e-mailbericht van Noor":"Noor's personal email","Vertrouwelijkheid":"Confidentiality","register, classificatie in de Office Assistent":"register, classified in the Office Assistant","Status":"Status","register":"register","Persoonsgegevens":"Personal data","ja":"yes","Zaak":"Case","behandelaar {0}":"handler {0}","zaaksysteem":"case management system","Handeling":"Action","Lezen":"Read","Wijzigen":"Edit","Zegelen":"Seal","Publiceren":"Publish","Te ruim in het huidige model: de rol geeft toegang, maar het stuk of de zaak rechtvaardigt het niet.":"Too broad in the current model: the role grants access, but the document or the case does not justify it.","Nu: rollen en ACL's":"Now: roles and ACLs","in elke toepassing apart ingesteld":"configured separately in each application","Toegestaan":"Permitted","Rol vergunningverlener: lezen en schrijven in alle zaken van dit zaaktype.":"Permit officer role: read and write in all cases of this case type.","Straks: beleid":"Soon: policy","één beslispunt, met rol, eigenschappen en relatie":"one decision point, with role, attributes and relationship","Geweigerd":"Denied","Vraag aan het beslispunt (AuthZEN)":"Request to the decision point (AuthZEN)","Antwoord":"Response","Het handhavingspunt is het register van XENA. Het stelt de vraag, het beslispunt antwoordt met een besluit en een reden. Welke software beslist, maakt voor het register niet uit.":"The enforcement point is the XENA register. It asks the question; the decision point answers with a decision and a reason. Which software decides makes no difference to the register.","Team Ruimte":"Spatial Planning Team","Beleidsmedewerker":"Policy officer","Beide modellen komen hier tot hetzelfde besluit.":"Both models reach the same decision here.","Geen rol en geen teammap die toegang geeft.":"No role and no team folder that grants access.","Zaakvertrouwelijk, en geen relatie met de zaak.":"Case-confidential, and no relationship with the case.","Geen rol zegelbevoegd.":"No authorised-to-seal role.","Geen rol publiceren.":"No publish role.","Vastgesteld":"Finalised","ja, geanonimiseerde weergave aanwezig":"yes, anonymised version available","Een vastgestelde versie verandert niet. Wie iets wil wijzigen, maakt een nieuwe versie.":"A finalised version does not change. Anyone who wants to make a change creates a new version.","Openbaar":"Public","nee":"no","Eigenaar":"Owner","Openbaar: elke medewerker.":"Public: every employee.","Eigenaar van het stuk.":"Owner of the document.","Persoonlijk":"Personal","Ontvangen":"Received","Persoonlijke berichten vallen buiten zegelen en publiceren.":"Personal messages are outside the scope of sealing and publishing.","ACL van de postbus: alleen de eigenaar.":"Mailbox ACL: owner only.","Persoonlijk bericht: alleen de eigenaar.":"Personal message: owner only.","Vergunningverlener":"Permit officer","Behandelaar van de zaak, volgens het zaaksysteem.":"Case handler, according to the case management system.","Behandelaar van de zaak, en de zaak loopt nog.":"Case handler, and the case is still ongoing.","Openbaar stuk: elke medewerker mag lezen.":"Public document: every employee may read it.","Persoonlijk bericht: alleen de eigenaar. Een ander krijgt toegang alleen met een besluit van de gemeentesecretaris.":"Personal message: owner only. Anyone else gets access only by decision of the municipal secretary.","Lid van het team dat de zaak behandelt.":"Member of the team handling the case.","Griffie":"Council clerk's office","Medewerker griffie":"Council clerk's office officer","zegelbevoegd":"authorised to seal","publiceren":"publish","Alleen een vastgesteld stuk wordt gepubliceerd.":"Only a finalised document is published.","Rol publiceren in het publicatieplatform.":"Publish role in the publication platform.","Alleen een vastgestelde versie wordt gezegeld.":"Only a finalised version is sealed.","Rol zegelbevoegd in de zegeldienst.":"Authorised-to-seal role in the sealing service.","Vastgesteld en geanonimiseerd.":"Finalised and anonymised.","Verplichting: alleen de geanonimiseerde weergave wordt gepubliceerd.":"Obligation: only the anonymised version is published.","Rol zegelbevoegd, en de versie is vastgesteld.":"Authorised-to-seal role, and the version is finalised.","Verplichting: tweede factor bij het zegelen.":"Obligation: second factor when sealing.","Vastgesteld en openbaar.":"Finalised and public.","Team Informatievoorziening":"Information Services Team","Functioneel beheerder zaaksysteem":"Case management system application administrator","beheerder zaaksysteem":"case management system administrator","Beheerders zien de metadata, niet de inhoud.":"Administrators see the metadata, not the content.","Beheerders van het zaaksysteem hebben toegang tot alle zaken.":"Case management system administrators have access to all cases.","Inhoud alleen met een vastgelegde reden en melding aan security (break-glass).":"Content only with a recorded reason and notification to security (break-glass).","Van personeelsdossier tot toegang":"From HR record to access","IRIS legt de lagen vast die bepalen wie er mag inloggen en wat iemand daarna mag. Saviynt beheert wie wat mag, Keycloak houdt de sessies bij, en een beslispunt neemt de besluiten op stukken.":"IRIS sets out the layers that determine who may sign in and what they may do after that. Saviynt manages who may do what, Keycloak keeps track of the sessions, and a decision point takes the decisions on documents.","In dienst, overstap, uit dienst":"Joiner, mover, leaver","Leidinggevenden":"Managers","Vragen extra rechten aan en herzien ze":"Request additional rights and review them","Bron":"Source","Wie er werkt, in welke functie en in welk team.":"Who works here, in which job and in which team.","Herzien · bekijk de stappen":"Review · view the steps","Rolmodel":"Role model","Geboorterechten per functie; extra rechten per aanvraag":"Birthright access per job; additional rights on request","Aanvragen en goedkeuren":"Request and approval","Met reden, goedkeurder en einddatum":"With reason, approver and end date","Functiescheiding":"Segregation of duties","Combinaties die niet mogen":"Combinations that are not allowed","Hercertificering":"Recertification","Elk halfjaar, per leidinggevende":"Every six months, per manager","Provisioning":"Provisioning","Naar Entra ID en Keycloak; later naar systemen via SCIM":"To Entra ID and Keycloak; later to systems via SCIM","Identity governance: Saviynt":"Identity governance: Saviynt","Hier staat wie wat mag, en waarom. Rollen worden hier gewijzigd, nergens anders.":"This is where who may do what is recorded, and why. Roles are changed here and nowhere else.","Aanmelden · bekijk de stappen":"Sign-in · view the steps","Account":"Account","Aangemaakt en uitgezet door Saviynt":"Created and disabled by Saviynt","Tweede factor":"Second factor","Authenticator; later ook passkeys":"Authenticator; later also passkeys","Identiteitsbron: Entra ID":"Identity source: Entra ID","Wie iemand is, met wachtwoord en tweede factor. Naar een alternatief wordt gezocht.":"Who someone is, with password and second factor. An alternative is being sought.","federatie":"federation","Sessies":"Sessions","Eén keer aanmelden, overal uitloggen":"Sign in once, sign out everywhere","Tokens":"Tokens","Met team, functie en rollen als claims":"With team, job and roles as claims","Token exchange":"Token exchange","Voor de assistent, namens de medewerker":"For the assistant, on behalf of the employee","Omgeving voor inwoners":"Realm for residents","Apart, met DigiD, voor TINA":"Separate, with DigiD, for TINA","Sessies en tokens: Keycloak":"Sessions and tokens: Keycloak","De enige plek waar systemen hun aanmelding vandaan halen. Daardoor is de identiteitsbron te vervangen.":"The only place systems get their sign-in from. That makes the identity source replaceable.","Toegangsbeslissing · bekijk de stappen":"Access decision · view the steps","Beslispunt":"Decision point","Neemt besluiten met reden; de software is vervangbaar":"Takes decisions with a reason; the software is replaceable","Beleid als code":"Policy as code","In git, met review en tests":"In git, with review and tests","Informatiebronnen":"Information sources","Token, register, zaaksysteem":"Token, register, case management system","Autorisatie, straks: beslispunt":"Authorisation, soon: decision point","Eén plek voor de regels, als code. Elke toepassing vraagt het besluit via AuthZEN.":"One place for the rules, as code. Each application requests the decision via AuthZEN.","Namens de medewerker · bekijk de stappen":"On behalf of the employee · view the steps","XENA-register en opslag":"XENA register and storage","Het handhavingspunt voor stukken":"The enforcement point for documents","Office Assistent":"Office Assistant","Altijd namens de medewerker":"Always on behalf of the employee","ELSA en MAIA":"ELSA and MAIA","E-mail en chat; persoonlijk blijft afgeschermd":"Email and chat; personal stays shielded","VERA":"VERA","Rol zegelbevoegd, met tweede factor per zegel":"Authorised-to-seal role, with a second factor per seal","Blijft leidend voor wie welke zaak behandelt":"Remains authoritative for who handles which case","Toepassingen uit de demo's":"Applications from the demos","Elk handhaaft het besluit; geen eigen lijsten van wie wat mag.":"Each enforces the decision; no lists of their own of who may do what.","Uit dienst · bekijk de stappen":"Leaver · view the steps","Auditlog en SIEM":"Audit log and SIEM","Elk besluit, elke wijziging van rechten":"Every decision, every change of rights","CISO":"CISO","Verslagen van hercertificering, voor de BIO":"Recertification reports, for the BIO","Toezicht":"Oversight","Wat er gebeurt bij een handeling":"What happens during an action","Kies een handeling. De stappen laten zien welk onderdeel wat doet.":"Choose an action. The steps show which component does what.","Aanmelden":"Sign-in","De assistent handelt namens de medewerker":"The assistant acts on behalf of the employee","Een toegangsbeslissing":"An access decision","Uit dienst: sessies beëindigen":"Leaver: ending sessions","Een inwoner bij TINA":"A resident on TINA","Noor opent de Office Assistent. Die stuurt haar door naar Keycloak.":"Noor opens the Office Assistant. It redirects her to Keycloak.","Keycloak stuurt door naar Entra ID voor wachtwoord en tweede factor.":"Keycloak redirects to Entra ID for password and second factor.","Entra ID bevestigt wie Noor is. Entra ID is de identiteitsbron, niet de plek van de sessie.":"Entra ID confirms who Noor is. Entra ID is the identity source, not where the session lives.","Keycloak maakt de sessie en geeft een token met wie ze is, haar team en haar rollen. Het token is vijf minuten geldig en wordt stil vernieuwd.":"Keycloak creates the session and issues a token stating who she is, her team and her roles. The token is valid for five minutes and is renewed silently.","De assistent toont alleen de functies die bij die rollen horen.":"The assistant shows only the functions that go with those roles.","Open punten":"Open issues","Saviynt is een clouddienst":"Saviynt is a cloud service","Saviynt draait als dienst van een Amerikaanse leverancier en bevat wie er werkt en wat ieder mag. Dat schuurt met het zoeken naar alternatieven voor Entra ID. Een bewuste afweging is nodig, met afspraken over waar de gegevens staan.":"Saviynt runs as a service from an American vendor and holds who works here and what everyone may do. That sits uneasily with the search for alternatives to Entra ID. A deliberate trade-off is needed, with agreements on where the data is held.","Keycloak wordt een kritieke schakel":"Keycloak becomes a critical link","Als Keycloak niet werkt, kan niemand aanmelden. Dat vraagt hoge beschikbaarheid, eigen beheer en een vast moment voor updates.":"If Keycloak is down, nobody can sign in. That calls for high availability, in-house operation and a fixed slot for updates.","Eén plek voor rollen":"One place for roles","Rollen veranderen in Saviynt, nooit met de hand in Keycloak of in een toepassing. Anders lopen de twee uit elkaar en klopt de hercertificering niet meer.":"Roles change in Saviynt, never by hand in Keycloak or in an application. Otherwise the two drift apart and the recertification is no longer accurate.","Het zaaksysteem blijft leidend":"The case management system remains authoritative","Wie welke zaak behandelt, staat in het zaaksysteem. IAM levert rol en team; het beslispunt vraagt de relatie met de zaak op, en neemt die niet over.":"Who handles which case is recorded in the case management system. IAM supplies role and team; the decision point queries the relationship with the case rather than taking it over.","Geen beleid zonder metadata":"No policy without metadata","Een besluit op vertrouwelijkheid of persoonsgegevens kan alleen als het stuk geclassificeerd is. Classificeren in de Office Assistent is dus een voorwaarde, geen extra.":"A decision based on confidentiality or personal data is only possible if the document is classified. Classifying in the Office Assistant is therefore a prerequisite, not an extra.","Wat nog experimenteel is":"What is still experimental","SCIM in Keycloak (vanaf versie 26.6) en Shared Signals in Keycloak zijn experimenteel. Het ontwerp leunt er pas op als ze stabiel zijn.":"SCIM in Keycloak (from version 26.6) and Shared Signals in Keycloak are experimental. The design relies on them only once they are stable.","Noor kiest in het paneel Classificeren. De assistent moet daarvoor het register aanroepen.":"Noor chooses Classify in the panel. To do so, the assistant has to call the register.","De assistent ruilt het token van Noor in voor een token voor het register (token exchange). Dat token zegt: de assistent, namens Noor.":"The assistant exchanges Noor's token for a token for the register (token exchange). That token says: the assistant, on behalf of Noor.","Het register vraagt het beslispunt of Noor dit stuk mag classificeren.":"The register asks the decision point whether Noor may classify this document.","Het register voert het uit en legt vast: Noor, via de assistent.":"The register carries it out and records: Noor, via the assistant.","De assistent heeft zelf geen rechten op stukken. Wat Noor niet mag, kan de assistent ook niet.":"The assistant has no rights of its own on documents. What Noor may not do, the assistant cannot do either.","Daan opent een aanvraag omgevingsvergunning. Het register is het handhavingspunt.":"Daan opens an environmental permit application. The register is the enforcement point.","Het register stelt de vraag via AuthZEN: deze persoon, deze handeling, dit stuk.":"The register asks via AuthZEN: this person, this action, this document.","Het beslispunt haalt wat het nodig
