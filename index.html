heeft: rol en team uit het token, vertrouwelijkheid en status uit het register, de behandelaar uit het zaaksysteem.":"The decision point fetches what it needs: role and team from the token, confidentiality and status from the register, the case handler from the case management system.","Het beleid, als code in git, geeft het besluit met de reden.":"The policy, as code in git, returns the decision with the reason.","Het register toont het stuk, of niet, en legt het besluit vast.":"The register shows the document, or not, and records the decision.","Saviynt zet het account uit in Entra ID en Keycloak.":"Saviynt disables the account in Entra ID and Keycloak.","Keycloak beëindigt alle sessies en meldt dat aan de systemen (back-channel logout).":"Keycloak ends all sessions and notifies the systems (back-channel logout).","Elk systeem gooit de sessie weg. Later ook via een signaal volgens Shared Signals, zodra Keycloak dat stabiel ondersteunt.":"Each system discards the session. Later also via a Shared Signals event, once Keycloak supports it stably.","Het auditlog legt vast wanneer welke toegang verviel.":"The audit log records when which access was removed.","Elk halfjaar legt Saviynt aan elke leidinggevende voor wie welke extra rechten heeft.":"Every six months, Saviynt presents each manager with who has which additional rights.","De leidinggevende bevestigt of trekt in. Geen antwoord betekent intrekken.":"The manager confirms or revokes. No answer means revoke.","Ingetrokken rechten verdwijnen uit de groepen in Keycloak.":"Revoked rights disappear from the groups in Keycloak.","Het verslag gaat naar de CISO, als bewijs voor de BIO.":"The report goes to the CISO, as evidence for the BIO.","TINA":"TINA","Een inwoner wil een eigen stuk downloaden.":"A resident wants to download one of their own documents.","Een aparte omgeving in Keycloak, alleen voor inwoners, stuurt door naar DigiD.":"A separate realm in Keycloak, for residents only, redirects to DigiD.","DigiD":"DigiD","DigiD bevestigt wie de inwoner is.":"DigiD confirms who the resident is.","Het beleid geeft de inwoner alleen de eigen stukken en openbare stukken.":"The policy gives the resident only their own documents and public documents.","Inwoners staan niet in Saviynt en krijgen geen rollen. Hun toegang volgt uit wie ze zijn.":"Residents are not in Saviynt and get no roles. Their access follows from who they are.","Rollen per zaaktype":"Roles per case type","Nextcloud-stack":"Nextcloud stack","Deelrechten op mappen":"Sharing rights on folders","Mailarchief":"Mail archive","Rechten op postbussen":"Rights on mailboxes","Zegeldienst":"Sealing service","Een lijst in de configuratie":"A list in the configuration","Autorisatie, nu":"Authorisation, now","Elke toepassing beslist zelf, met eigen rollen en ACL's die functioneel beheer met de hand bijhoudt.":"Each application decides for itself, with its own roles and ACLs that application management maintains by hand.","De technische opbouw":"The technical structure","Drie vragen, drie plekken. Wie mag wat: Saviynt. Wie is dit en is de sessie nog geldig: Entra ID en Keycloak. Mag dit nu, met dit stuk: het beslispunt. Wat als kandidaat staat, is een voorstel om te toetsen.":"Three questions, three places. Who may do what: Saviynt. Who is this, and is the session still valid: Entra ID and Keycloak. Is this allowed now, with this document: the decision point. Anything marked as a candidate is a proposal to be tested.","Componenten en technologie":"Components and technology","Onderdeel":"Component","Technologie":"Technology","Waar":"Where","Identity governance":"Identity governance","Saviynt Identity Cloud":"Saviynt Identity Cloud","Clouddienst":"Cloud service","Uitgangspunt":"Principle","Identiteitsbron en tweede factor":"Identity source and second factor","Microsoft Entra ID; een alternatief wordt gezocht":"Microsoft Entra ID; an alternative is being sought","Sessies en tokens":"Sessions and tokens","Keycloak, open source":"Keycloak, open source","Eigen datacenter, hoog beschikbaar":"Own data centre, highly available","Kandidaat":"Candidate","Open Policy Agent, Cedar of OpenFGA, achter de AuthZEN-interface":"Open Policy Agent, Cedar or OpenFGA, behind the AuthZEN interface","Eigen datacenter, dicht bij elk handhavingspunt":"Own data centre, close to each enforcement point","Git, met review en geautomatiseerde tests":"Git, with review and automated tests","Eigen beheer":"In-house","Auditlog":"Audit log","De bestaande SIEM":"The existing SIEM","Per systeem uit de demo's":"Per system from the demos","Hoe elk systeem aanmeldt, waar de rollen vandaan komen en wat functioneel beheer nog doet.":"How each system handles sign-in, where the roles come from and what application management still does.","Systeem":"System","Rollen komen binnen via":"Roles arrive via","Fijnmazig":"Fine-grained","Wat functioneel beheer nog doet":"What application management still does","OpenID Connect via Keycloak":"OpenID Connect via Keycloak","Claims in het token":"Claims in the token","Het register vraagt het beslispunt (AuthZEN)":"The register asks the decision point (AuthZEN)","Niets voor toegang; wel het beleid mee opstellen.":"Nothing for access; does help to draft the policy.","De OpenID Connect-app van Nextcloud":"Nextcloud's OpenID Connect app","Groepen uit het token, bij elke aanmelding bijgewerkt; opheffen via de provisioning-API":"Groups from the token, updated at every sign-in; removal via the provisioning API","Via het register, niet via deelrechten op mappen":"Via the register, not via sharing rights on folders","Groepen één keer koppelen aan rollen.":"Map groups to roles once.","Office Assistent (MIRA)":"Office Assistant (MIRA)","Token van de kantoorapplicatie, ingeruild bij Keycloak (RFC 8693)":"Token from the office application, exchanged at Keycloak (RFC 8693)","Claims; de assistent toont alleen wat bij de rollen hoort":"Claims; the assistant shows only what goes with the roles","Altijd namens de medewerker, zonder eigen rechten op stukken":"Always on behalf of the employee, without rights of its own on documents","Niets.":"Nothing.","E-mailarchief (ELSA)":"Email archive (ELSA)","IMAP met een token (OAUTHBEARER, RFC 7628)":"IMAP with a token (OAUTHBEARER, RFC 7628)","Claims; gedeelde postbussen als rol":"Claims; shared mailboxes as a role","Persoonlijke berichten: alleen de eigenaar, toegang voor een ander alleen met besluit van de gemeentesecretaris":"Personal messages: owner only; access for anyone else only by decision of the municipal secretary","Gedeelde postbussen als rol beschrijven.":"Describe shared mailboxes as roles.","Chatarchief (MAIA)":"Chat archive (MAIA)","OpenID Connect":"OpenID Connect","Claims":"Claims","Via het register":"Via the register","Zegeldienst (VERA)":"Sealing service (VERA)","OpenID Connect, met tweede factor per zegel":"OpenID Connect, with a second factor per seal","Rol zegelbevoegd, aangevraagd en goedgekeurd in Saviynt":"Authorised-to-seal role, requested and approved in Saviynt","Beleid: alleen vastgestelde versies":"Policy: finalised versions only","Niets; de lijst in de configuratie vervalt.":"Nothing; the list in the configuration goes away.","Saviynt beheert de rollen per zaaktype, via een connector (REST, later SCIM)":"Saviynt manages the roles per case type, via a connector (REST, later SCIM)","Blijft leidend voor wie welke zaak behandelt, en levert die relatie aan het beslispunt":"Remains authoritative for who handles which case, and supplies that relationship to the decision point","Zaken toewijzen en rollen per zaaktype inrichten.":"Assign cases and set up roles per case type.","Zoekportaal (TINA)":"Search portal (TINA)","Aparte omgeving in Keycloak, met DigiD":"Separate realm in Keycloak, with DigiD","Geen rollen: inwoners staan niet in Saviynt":"No roles: residents are not in Saviynt","Eigen stukken en openbare stukken":"Own documents and public documents","Van RBAC naar beleid":"From RBAC to policy","Geen keuze voor één model: beleid combineert ze. De overstap kan per systeem, zonder dat de toepassing verandert.":"No choice of a single model: policy combines them. The switch can happen system by system, without the application changing.","Model":"Model","Wat beslist":"What decides","Sterk":"Strengths","Zwak":"Weaknesses","RBAC":"RBAC","De rol van de persoon":"The person's role","Eenvoudig, en goed te herzien in Saviynt":"Simple, and easy to review in Saviynt","Grof: een rol geeft toegang tot alles van een soort. Rollen stapelen, en elke uitzondering wordt een nieuwe rol.":"Coarse: a role gives access to everything of a kind. Roles pile up, and every exception becomes a new role.","ABAC":"ABAC","Eigenschappen van persoon, stuk en situatie":"Attributes of person, document and context","Fijnmazig zonder een explosie van rollen; volgt de metadata":"Fine-grained without role explosion; follows the metadata","Vraagt betrouwbare metadata. Een besluit is lastiger uit te leggen.":"Requires reliable metadata. A decision is harder to explain.","ReBAC":"ReBAC","De relatie tussen persoon en stuk, zoals behandelaar van een zaak":"The relationship between person and document, such as handler of a case","Past bij zaakgericht werken; de relaties komen uit het zaaksysteem":"Fits case-based working; the relationships come from the case management system","Vraagt een actuele kopie van die relaties, of een snelle bevraging.":"Requires an up-to-date copy of those relationships, or a fast lookup.","PBAC":"PBAC","Beleid als code dat rol, eigenschappen en relaties combineert":"Policy as code that combines role, attributes and relationships","Eén plek voor de regels, te testen, met een reden bij elk besluit":"One place for the rules, testable, with a reason for every decision","Een extra onderdeel bij elke aanvraag. Beschikbaarheid en snelheid worden kritiek.":"An extra component in every request. Availability and speed become critical.","Ontwerpregels":"Design rules","Rollen veranderen alleen in Saviynt. Wie in Keycloak of in een toepassing met de hand iets wijzigt, ziet het bij de volgende synchronisatie verdwijnen.":"Roles change only in Saviynt. Anyone who changes something by hand in Keycloak or in an application will see it disappear at the next synchronisation.","Tokens zijn kort geldig, vijf minuten. Intrekken werkt dan ook voor systemen die geen melding verwerken.":"Tokens are short-lived: five minutes. That way revocation also works for systems that do not process notifications.","Een assistent of een automatisch proces heeft een eigen identiteit, met zo weinig rechten als kan. Handelt het namens een medewerker, dan met diens token.":"An assistant or an automated process has its own identity, with as few rights as possible. When it acts on behalf of an employee, it uses that employee's token.","Elk besluit heeft een reden, en die komt in het auditlog.":"Every decision has a reason, and it goes into the audit log.","Inwoners en medewerkers staan in aparte omgevingen. Een fout in de een raakt de ander niet.":"Residents and employees are in separate realms. A fault in one does not affect the other.","Standaarden":"Standards","SCIM 2.0":"SCIM 2.0","RFC 7643 en 7644":"RFC 7643 and 7644","Accounts en groepen aanmaken, wijzigen en opheffen. Keycloak krijgt een SCIM-server, experimenteel vanaf versie 26.6.":"Creating, changing and removing accounts and groups. Keycloak is getting a SCIM server, experimental from version 26.6.","OpenID NLGov-profiel (Logius)":"OpenID NLGov profile (Logius)","Aanmelden en identiteitstokens.":"Sign-in and identity tokens.","OAuth 2.0":"OAuth 2.0","NL GOV Assurance profile (Logius)":"NL GOV Assurance profile (Logius)","Tokens voor API's binnen de overheid.":"Tokens for APIs within government.","RFC 8693":"RFC 8693","Een assistent handelt namens de medewerker, met diens rechten.":"An assistant acts on behalf of the employee, with the employee's rights.","AuthZEN":"AuthZEN","Authorization API 1.0, OpenID Foundation, definitief sinds januari 2026":"Authorization API 1.0, OpenID Foundation, final since January 2026","Eén interface tussen handhavingspunt en beslispunt. Het beslispunt is zo te vervangen.":"One interface between enforcement point and decision point. This makes the decision point replaceable.","Shared Signals en CAEP":"Shared Signals and CAEP","OpenID Foundation, definitief sinds september 2025":"OpenID Foundation, final since September 2025","Een melding bij intrekking, direct naar elk systeem. In Keycloak nog experimenteel.":"A notification on revocation, straight to every system. Still experimental in Keycloak.","OAUTHBEARER":"OAUTHBEARER","RFC 7628":"RFC 7628","Aanmelden bij IMAP met een token in plaats van een wachtwoord.":"Signing in to IMAP with a token instead of a password.","BIO":"BIO","Baseline Informatiebeveiliging Overheid, op basis van ISO 27002":"Baseline Informatiebeveiliging Overheid (Dutch government information security baseline), based on ISO 27002","Toegangsbeheer: identiteiten, rechten en het herzien ervan.":"Access control: identities, rights and their review.","Passkeys":"Passkeys","W3C WebAuthn en FIDO2":"W3C WebAuthn and FIDO2","Een tweede factor die niet afhangt van één leverancier.":"A second factor that does not depend on a single vendor.","Van handwerk naar beleid":"From manual work to policy","Concept. Dit is een volgorde, geen planning. Elke stap levert iets op, en geen stap vraagt dat een toepassing anders gaat werken voor de medewerker.":"Draft. This is a sequence, not a schedule. Each step delivers something, and no step requires an application to work differently for the employee.","stap {0}":"step {0}","Zelf te doen":"Can do ourselves","Rolcatalogus voor de demo-systemen":"Role catalogue for the demo systems","eerst":"first","Wat functioneel beheer merkt":"What application management notices","Een inventaris van de rollen in elk systeem, en per functie welke rollen erbij horen.":"An inventory of the roles in each system, and for each job which roles go with it.","Wat het platform moet kunnen":"What the platform must be able to do","Niets nieuws. Saviynt leest de bestaande rollen in.":"Nothing new. Saviynt imports the existing roles.","Wat het van leveranciers vraagt":"What it asks of vendors","Medewerking van functioneel beheer en de teamleiders.":"Cooperation from application management and the team leaders.","Per functie een set geboorterechten, vastgesteld door de leidinggevenden.":"A set of birthright access per job, agreed by the managers.","Aanmelden via Keycloak":"Sign-in via Keycloak","daarna":"then","Geen accounts meer aanmaken: systemen maken ze zelf bij de eerste aanmelding, met de rollen uit het token.":"No more creating accounts: systems create them themselves at the first sign-in, with the roles from the token.","Keycloak hoog beschikbaar, met Entra ID als identiteitsbron erachter. Elk systeem gebruikt OpenID Connect.":"Keycloak highly available, with Entra ID behind it as the identity source. Every system uses OpenID Connect.","Systemen die OpenID Connect ondersteunen, met rollen uit claims.":"Systems that support OpenID Connect, with roles from claims.","Alle demo-systemen melden aan via Keycloak.":"All demo systems sign in via Keycloak.","Saviynt provisioneert":"Saviynt provisions","In dienst, overstap en uit dienst gaan vanzelf. Geen tickets meer per systeem voor de geboorterechten.":"Joiners, movers and leavers are handled automatically. No more tickets per system for birthright access.","Koppelingen van Saviynt naar Entra ID en Keycloak. Uit dienst binnen vijf minuten, met beëindigde sessies.":"Connectors from Saviynt to Entra ID and Keycloak. Leavers out within five minutes, with sessions ended.","Een betrouwbare koppeling met Keycloak; de connector van Saviynt is een communityversie.":"A reliable connector to Keycloak; Saviynt's connector is a community version.","Geen slapende accounts meer in de demo-systemen.":"No more dormant accounts in the demo systems.","Aanvragen en herzien":"Request and review","Extra rechten, zoals zegelbevoegd of een gedeelde postbus, gaan via een aanvraag met goedkeuring. Elk halfjaar herzien.":"Additional rights, such as authorised to seal or a shared mailbox, go through a request with approval. Reviewed every six months.","Werkstromen in Saviynt, met functiescheiding.":"Workflows in Saviynt, with segregation of duties.","Niets bijzonders.":"Nothing special.","Elke extra bevoegdheid heeft een goedkeurder en een herziening.":"Every additional entitlement has an approver and a review.","Besluiten naar het beslispunt":"Decisions to the decision point","Nog niets: de regels van nu gaan één op één over naar beleid als code, eerst alleen meekijkend.":"Nothing yet: today's rules move one-to-one into policy as code, at first in shadow mode only.","Het register als handhavingspunt, met AuthZEN. Het beslispunt draait naast het register.":"The register as enforcement point, with AuthZEN. The decision point runs alongside the register.","Een beslispunt dat AuthZEN spreekt.":"A decision point that speaks AuthZEN.","Het beslispunt neemt dezelfde besluiten als de systemen zelf, aantoonbaar.":"The decision point demonstrably takes the same decisions as the systems themselves.","Eigenschappen en relaties":"Attributes and relationships","ACL's verdwijnen. Toegang volgt uit de vertrouwelijkheid van het stuk en de relatie met de zaak.":"ACLs disappear. Access follows from the document's confidentiality and the relationship with the case.","Classificatie uit de Office Assistent in het register; de behandelaar uit het zaaksysteem.":"Classification from the Office Assistant in the register; the case handler from the case management system.","Een zaaksysteem dat de relatie met een zaak snel kan geven.":"A case management system that can return the relationship with a case quickly.","Geen ACL's meer in XENA en de Nextcloud-stack.":"No more ACLs in XENA and the Nextcloud stack.","Afhankelijk van de markt":"Depends on the market","Meldingen bij intrekken":"Notifications on revocation","later":"later","Niets: intrekken gaat nog sneller, ook bij een verloren laptop.":"Nothing: revocation gets even faster, including for a lost laptop.","Shared Signals en CAEP tussen Keycloak en de systemen.":"Shared Signals and CAEP between Keycloak and the systems.","Stabiele ondersteuning in Keycloak en in de systemen.":"Stable support in Keycloak and in the systems.","Een ingetrokken sessie stopt in seconden, overal.":"A revoked session stops within seconds, everywhere.","Identiteitsbron vervangbaar":"Replaceable identity source","Een andere manier van aanmelden, bijvoorbeeld met een passkey. Verder niets.":"A different way of signing in, for example with a passkey. Nothing else.","Een andere identiteitsbron achter Keycloak; samenwerking met Zandvoort via federatie.":"A different identity source behind Keycloak; collaboration with Zandvoort via federation.","Een alternatief voor Entra ID dat Saviynt kan voeden.":"An alternative to Entra ID that Saviynt can feed.","Entra ID is te vervangen zonder dat een systeem verandert.":"Entra ID can be replaced without any system changing.","Waarom met de demo-systemen beginnen":"Why start with the demo systems","Ze zijn nieuw of worden nieuw ingericht. Er is geen erfenis van ACL's om op te ruimen.":"They are new or being newly set up. There is no legacy of ACLs to clean up.","Ze delen één register. Eén handhavingspunt dekt opslag, e-mail, chat en zegels.":"They share one register. One enforcement point covers storage, email, chat and seals.","Wat werkt, is daarna een voorbeeld voor het zaaksysteem en de andere applicaties.":"What works then becomes an example for the case management system and the other applications.","Waar het kan schuren":"Where friction may arise","Een rolmodel vraagt dat teamleiders vastleggen wat bij een functie hoort. Dat is organisatiewerk, geen techniek.":"A role model requires team leaders to define what goes with a job. That is organisational work, not technology.","Wie gewend is rechten te kopiëren van een collega, ervaart een aanvraag met goedkeuring als trager.":"Anyone used to copying a colleague's rights will find a request with approval slower.","Beleid op eigenschappen werkt alleen met geclassificeerde stukken. Oude stukken zonder classificatie vallen terug op de regels van nu.":"Attribute-based policy only works with classified documents. Older documents without a classification fall back on today's rules.","IRIS laat zien hoe gebruikersbeheer voor de systemen uit de demo's te automatiseren is: van het personeelsdossier tot het besluit op een stuk. Voor IT-beheer, security en architecten.":"IRIS shows how user management for the systems in the demos can be automated: from the HR record to the decision on a document. For IT operations, security and architects.","Weergaven":"Views","In dienst, overstap, extra bevoegdheid, uit dienst en samenwerking: stap voor stap, nu met de hand en straks geautomatiseerd.":"Joiner, mover, additional authorisation, leaver and collaboration: step by step, manually now and automated soon.","Open deze weergave":"Open this view","Kies een persoon, een stuk en een handeling. Zie het besluit van nu naast dat van een beleidsbeslispunt, met de AuthZEN-vraag erbij.":"Choose a person, a document and an action. See today's decision next to that of a policy decision point, with the AuthZEN request included.","De lagen van personeelsdossier tot toegang, en de stappen bij aanmelden, handelen namens, beslissen, uit dienst en herzien.":"The layers from HR record to access, and the steps for sign-in, acting on behalf, deciding, leaving and review.","Componenten, de koppeling per systeem uit de demo's, de modellen van RBAC tot beleid, ontwerpregels en standaarden.":"Components, the integration per system from the demos, the models from RBAC to policy, design rules and standards.","Acht stappen, beginnend met een rolcatalogus voor de demo-systemen.":"Eight steps, starting with a role catalogue for the demo systems.","Makers, licentie en contact staan in het colofon, onder de titel.":"Authors, licence and contact details are in the colophon, below the title.","Colofon openen":"Open colophon","De schakelaar":"The switch","Nu, met de hand per systeem, of straks, geautomatiseerd. De situatie verandert de stappen in Levenscyclus en de autorisatielaag in Architectuur.":"Now, manually per system, or soon, automated. The situation changes the steps in Lifecycle and the authorisation layer in Architecture.","De regel onderaan toont wat er technisch gebeurt bij een handeling.":"The line at the bottom shows what happens technically during an action.","Veelgestelde vragen":"Frequently asked questions","Zoek in de vragen":"Search the questions","Begrippen":"Key terms","Wat is het verschil tussen Saviynt en Keycloak?":"What is the difference between Saviynt and Keycloak?","Saviynt bepaalt wie wat mag en waarom: rollen, aanvragen, herzieningen. Keycloak voert het uit bij elke aanmelding: sessies en tokens. Rollen veranderen in Saviynt, nooit in Keycloak.":"Saviynt determines who may do what and why: roles, requests, reviews. Keycloak carries it out at every sign-in: sessions and tokens. Roles change in Saviynt, never in Keycloak.","Waarom Keycloak tussen Entra ID en de systemen?":"Why put Keycloak between Entra ID and the systems?","Zodat de systemen niet aan Entra ID vastzitten. Wordt Entra ID vervangen, dan verandert alleen de koppeling achter Keycloak.":"So that the systems are not tied to Entra ID. If Entra ID is replaced, only the connection behind Keycloak changes.","Wat is een geboorterecht?":"What is birthright access?","De rechten die iemand krijgt door zijn functie, zonder aanvraag. Alles daarboven is een extra recht, met een aanvraag, een goedkeurder en een herziening.":"The rights someone gets through their job, without a request. Anything beyond that is an additional right, with a request, an approver and a review.","Beheer":"Administration","Verdwijnt het werk van functioneel beheer?":"Does the work of application management disappear?","Het handwerk wel: accounts aanmaken en rechten toekennen per ticket. Wat blijft, is inhoudelijk: rollen koppelen, zaken toewijzen, het beleid mee opstellen en uitzonderingen beoordelen.":"The manual work does: creating accounts and granting rights per ticket. What remains is substantive: mapping roles, assigning cases, helping to draft the policy and assessing exceptions.","Wie beslist wie zegelbevoegd is?":"Who decides who is authorised to seal?","De gemeentesecretaris, via een aanvraag in Saviynt. De zegeldienst kijkt alleen naar de rol in het token.":"The municipal secretary, via a request in Saviynt. The sealing service only looks at the role in the token.","Beveiliging":"Security","Hoe snel is iemand die vertrekt eruit?":"How quickly is a leaver locked out?","Op het geplande moment gaat het account uit en eindigen alle sessies. Tokens zijn vijf minuten geldig, dus binnen vijf minuten werkt niets meer.":"At the scheduled time, the account is disabled and all sessions end. Tokens are valid for five minutes, so within five minutes nothing works any more.","Heeft de Office Assistent eigen rechten?":"Does the Office Assistant have rights of its own?","Nee. De assistent handelt altijd namens de medewerker, met een ingeruild token. Wat de medewerker niet mag, kan de assistent ook niet.":"No. The assistant always acts on behalf of the employee, with an exchanged token. What the employee may not do, the assistant cannot do either.","Mag een beheerder alles zien?":"May an administrator see everything?","Een beheerder ziet de metadata. De inhoud alleen met een vastgelegde reden en een melding aan security.":"An administrator sees the metadata. The content only with a recorded reason and a notification to security.","Neemt IAM de rechten van het zaaksysteem over?":"Does IAM take over the case management system's permissions?","Nee. Het zaaksysteem blijft leidend voor wie welke zaak behandelt. Het beslispunt vraagt die relatie op.":"No. The case management system remains authoritative for who handles which case. The decision point queries that relationship.","Modellen":"Models","Moeten we meteen naar ABAC?":"Do we have to move to ABAC straight away?","Nee. Eerst gaan de regels van nu één op één naar het beslispunt. Daarna komen eigenschappen en relaties erbij, per soort stuk.":"No. First, today's rules move one-to-one to the decision point. Then attributes and relationships are added, per type of document.","Inwoners":"Residents","Staan inwoners ook in Saviynt?":"Are residents in Saviynt too?","Nee. Inwoners melden zich aan met DigiD in een aparte omgeving van Keycloak, en krijgen alleen hun eigen stukken en openbare stukken.":"No. Residents sign in with DigiD in a separate Keycloak realm, and get only their own documents and public documents.","IAM":"IAM","Identity and access management: wie iemand is en wat die mag.":"Identity and access management: who someone is and what they may do.","IGA":"IGA","Identity governance and administration: het beheer van rechten, met aanvragen, goedkeuring en herziening.":"Identity governance and administration: managing access rights, with requests, approval and review.","Geboorterecht":"Birthright access","Recht dat bij een functie hoort, zonder aanvraag.":"A right that comes with a job, without a request.","Rechtenstapeling":"Privilege creep","Rechten die zich opstapelen omdat oude niet worden ingetrokken.":"Rights that pile up because old ones are not revoked.","Het periodiek herzien van rechten door de leidinggevende.":"The periodic review of access rights by the manager.","Combinaties van rechten die niet bij één persoon mogen liggen.":"Combinations of rights that must not rest with a single person.","Toegang op grond van een rol.":"Access based on a role.","Toegang op grond van eigenschappen van persoon, stuk en situatie.":"Access based on attributes of person, document and context.","Toegang op grond van een relatie, zoals behandelaar van een zaak.":"Access based on a relationship, such as handler of a case.","Toegang op grond van beleid als code, dat de andere combineert.":"Access based on policy as code, combining the others.","Het onderdeel dat besluit of iets mag (PDP).":"The component that decides whether something is allowed (PDP).","Handhavingspunt":"Enforcement point","Het onderdeel dat het besluit uitvoert (PEP).":"The component that enforces the decision (PEP).","Standaard voor de vraag van handhavingspunt aan beslispunt.":"Standard for the request from enforcement point to decision point.","SCIM":"SCIM","Standaard om accounts en groepen aan te maken en op te heffen.":"Standard for creating and removing accounts and groups.","Een token inruilen voor een token voor een ander systeem, namens dezelfde persoon.":"Exchanging a token for a token for another system, on behalf of the same person.","Break-glass":"Break-glass","Toegang in uitzonderingen, met een vastgelegde reden en een melding.":"Emergency access in exceptional cases, with a recorded reason and a notification.","Interactieve demo, versie {0}":"Interactive demo, version {0}","Programma-architect en senior consultant":"Programme architect and senior consultant","Afdeling i-Ontwikkeling, Gemeente Haarlem":"i-Ontwikkeling department, Municipality of Haarlem","Gemaakt door":"Created by","Met assistentie van":"With assistance from","Contact":"Contact","Het ontwerp van geautomatiseerd gebruikersbeheer voor de systemen uit de demo's":"The design of automated user management for the systems in the demos","IT-beheer, security en architecten van de gemeenten Haarlem en Zandvoort":"IT operations, security and architects of the municipalities of Haarlem and Zandvoort","Het Common Ground-team en het samenwerkingsverband OWC":"The Common Ground team and the OWC partnership","Ten behoeve van":"Prepared for","Naar Iris, de boodschapper van de Griekse goden: zij brengt het bericht naar wie het aangaat":"After Iris, messenger of the Greek gods: she carries the message to whom it concerns","Naam":"Name","XENA, archiefwaardige opslag voor de medewerker":"XENA, archive-grade storage for staff","De architectuurvisie waarop deze demo is gebaseerd":"The architecture vision this demo is based on","Achtergrond":"Background","Gemeente Haarlem":"Municipality of Haarlem","Copyright":"Copyright","Vrij te gebruiken, aan te passen en te verspreiden onder de European Union Public Licence (EUPL) 1.2.":"Free to use, modify and distribute under the European Union Public Licence (EUPL) 1.2.","Tekst van de licentie":"Licence text","Licentie":"Licence","Een demo, geen product. Personen, stukken en aantallen zijn verzonnen. De demo toont wat de architectuur mogelijk maakt; welke leveranciers meewerken, moet nog blijken.":"A demo, not a product. People, documents and figures are fictitious. The demo shows what the architecture makes possible; which vendors will cooperate remains to be seen.","Sluiten":"Close","Bevat persoonsgegevens en is niet geanonimiseerd. Eerst anonimiseren in de Office Assistent.":"Contains personal data and is not anonymised. Anonymise it first in the Office Assistant.","Eigenaar of lid van het team, en het stuk is nog niet vastgesteld.":"Owner or team member, and the document is not yet finalised.","Geen eigenaar en geen lid van het team.":"Neither owner nor team member.","Geen vraag gevonden. Probeer een ander woord.":"No question found. Try a different word.","Te krap in het huidige model: toegang die past bij de relatie met het stuk, ontbreekt.":"Too narrow in the current model: access that fits the relationship with the document is missing.","Teammap van {0}: lezen en schrijven voor het hele team.":"Team folder ({0}): read and write for the whole team."},"fr":{"Gebruikersbeheer voor XENA: van het personeelsdossier tot het besluit op een stuk, zonder handwerk per systeem.":"Gestion des utilisateurs pour XENA : du dossier du personnel à la décision sur un document, sans travail manuel par système.","Versie {0}":"Version {0}","Colofon":"Colophon","Weergave":"Affichage","Levenscyclus":"Cycle de vie","Toegang":"Accès","Architectuur":"Architecture","Techniek":"Technique","Groeipad":"Trajectoire","Help":"Aide","Demo":"Démo","Situatie":"Situation","Nu: met de hand per systeem":"Aujourd'hui : à la main, système par système","Straks: geautomatiseerd":"Demain : automatisé","Saviynt beheert de rechten, Keycloak de sessies, een beslispunt de besluiten.":"Saviynt gère les droits, Keycloak les sessions, un point de décision les décisions.","Wie komt, wisselt en gaat":"Arrivées, mobilités et départs","Kies een gebeurtenis. Zet bovenaan Nu of Straks om te zien wat er verandert voor functioneel beheer, en wat er achterblijft.":"Choisissez un événement. Basculez en haut entre Aujourd'hui et Demain pour voir ce qui change pour l'administration fonctionnelle, et ce qui reste.","Gebeurtenis":"Événement","In dienst":"Arrivée","Daan Visser begint als vergunningverlener bij Team Vergunningen.":"Daan Visser arrive comme instructeur d'autorisations dans l'Équipe Autorisations.","Interne overstap":"Mobilité interne","Sanne de Vries gaat van Team Vergunningen naar Team Handhaving.":"Sanne de Vries passe de l'Équipe Autorisations à l'Équipe Contrôle.","Extra bevoegdheid":"Habilitation supplémentaire","Ilse Mulder van de griffie wordt zegelbevoegd.":"Ilse Mulder, du greffe, devient habilitée à sceller.","Uit dienst":"Départ","Noor Bakker vertrekt per 1 december.":"Noor Bakker quitte la commune le 1er décembre.","Samenwerking":"Collaboration","Een collega van Zandvoort werkt mee aan een gezamenlijk dossier.":"Un collègue de Zandvoort participe à un dossier commun.","straks, geautomatiseerd":"demain, automatisé","Speel af":"Lire","HR-systeem":"Système RH","dag −14":"jour −14","HR legt de indiensttreding vast.":"Les RH enregistrent l'arrivée.","Saviynt":"Saviynt","minuten":"minutes","Saviynt leest de wijziging en kent de geboorterechten toe die bij de functie vergunningverlener horen.":"Saviynt lit la modification et attribue les habilitations de base liées à la fonction d'instructeur d'autorisations.","Entra ID":"Entra ID","Saviynt maakt het account aan in Entra ID. De tweede factor stelt Daan in op de eerste werkdag.":"Saviynt crée le compte dans Entra ID. Daan configure le second facteur le premier jour de travail.","Keycloak":"Keycloak","Saviynt zet Daan in de groepen in Keycloak: medewerker, Team Vergunningen, vergunningverlener.":"Saviynt ajoute Daan aux groupes dans Keycloak : agent, Équipe Autorisations, instructeur d'autorisations.","Toepassingen":"Applications","eerste aanmelding":"première connexion","Bij de eerste aanmelding maakt elk systeem het account zelf aan uit het token, met de rollen die erin staan. Geen ticket per systeem.":"À la première connexion, chaque système crée lui-même le compte à partir du jeton, avec les rôles qu'il contient. Pas de ticket par système.","Zaaksysteem":"Système de gestion des affaires","eerste werkdag":"premier jour de travail","Welke zaken Daan behandelt, bepaalt de teamleider in het zaaksysteem, zoals nu.":"Les affaires que Daan traite sont fixées par le chef d'équipe dans le système de gestion des affaires, comme aujourd'hui.","Nu":"Aujourd'hui","met de hand":"à la main","Handelingen door mensen":"Actions humaines","Klaar":"Terminé","twee werkdagen na de start":"deux jours ouvrés après l'arrivée","Wat achterblijft":"Ce qui reste","Rechten gekopieerd van een collega: vaak meer dan nodig.":"Droits copiés sur un collègue : souvent plus que nécessaire.","Straks":"Demain","geautomatiseerd":"automatisé","op de eerste werkdag":"le premier jour de travail","Alleen wat bij de functie hoort; extra rechten via een aanvraag.":"Uniquement ce qui relève de la fonction ; droits supplémentaires sur demande.","Wat functioneel beheer niet meer doet":"Ce que l'administration fonctionnelle ne fait plus","Accounts aanmaken en opheffen, per systeem.":"Créer et supprimer des comptes, système par système.","Rechten toekennen op grond van een formulier of een mail.":"Attribuer des droits sur la base d'un formulaire ou d'un courriel.","Rechten kopiëren van een collega.":"Copier les droits d'un collègue.","Lijsten bijhouden van wie wat mag, in configuratiebestanden.":"Tenir à jour des listes de qui peut faire quoi, dans des fichiers de configuration.","Wat blijft":"Ce qui demeure","Per systeem één keer de eigen rollen koppelen aan de groepen in Keycloak.":"Associer une seule fois, pour chaque système, ses propres rôles aux groupes de Keycloak.","Zaken toewijzen in het zaaksysteem: dat blijft het zaaksysteem.":"Attribuer les affaires dans le système de gestion des affaires : cela reste son rôle.","Het beleid mee opstellen en testen, samen met informatiebeheer en security.":"Contribuer à rédiger et tester la politique, avec la gestion de l'information et la sécurité.","Uitzonderingen beoordelen die buiten het beleid vallen.":"Évaluer les exceptions qui sortent du cadre de la politique.","Onder de motorkap":"Sous le capot","demo versie {0}, {1}":"démo version {0}, {1}","Onderdeel van XENA, naast de opslag, MIRA, TINA, ELSA, MAIA en VERA.":"Fait partie de XENA, aux côtés du stockage, de MIRA, TINA, ELSA, MAIA et VERA.","Personen en stukken zijn verzonnen.":"Les personnes et les documents sont fictifs.","Situatie: nu, met de hand per systeem":"Situation : aujourd'hui, à la main, système par système","Functioneel beheerders houden de rechten in elk systeem met de hand bij.":"Les administrateurs fonctionnels tiennent les droits à jour à la main dans chaque système.","nu, met de hand":"aujourd'hui, à la main","HR legt de indiensttreding vast, twee weken van tevoren.":"Les RH enregistrent l'arrivée, deux semaines à l'avance.","Servicedesk":"Centre de services","dag −10":"jour −10","De leidinggevende vult een formulier in bij de servicedesk: account, mailbox, toegang tot de systemen.":"Le responsable remplit un formulaire auprès du centre de services : compte, boîte aux lettres, accès aux systèmes.","dag −5":"jour −5","De servicedesk maakt het account aan in Entra ID en zet het in de groepen die op het formulier staan.":"Le centre de services crée le compte dans Entra ID et l'ajoute aux groupes indiqués sur le formulaire.","Functioneel beheer":"Administration fonctionnelle","dag −3 tot +2":"jour −3 à +2","Per systeem een ticket. Het zaaksysteem, de Nextcloud-stack, het mailarchief: elke functioneel beheerder kent de rechten met de hand toe, vaak door die van een collega te kopiëren.":"Un ticket par système. Le système de gestion des affaires, la pile Nextcloud, l'archive de messagerie : chaque administrateur fonctionnel attribue les droits à la main, souvent en copiant ceux d'un collègue.","dag +2":"jour +2","Op de eerste werkdag werkt het meeste. Een vergeten systeem volgt na een nieuw ticket.":"Le premier jour, l'essentiel fonctionne. Un système oublié suit après un nouveau ticket.","Ticket bij de servicedesk · e-mail aan functioneel beheer · handmatige wijziging per systeem":"Ticket au centre de services · courriel à l'administration fonctionnelle · modification manuelle par système","Situatie: straks, geautomatiseerd":"Situation : demain, automatisé","dag 0":"jour 0","HR legt de nieuwe functie vast.":"Les RH enregistrent la nouvelle fonction.","dag 1":"jour 1","De nieuwe leidinggevende vraagt de nieuwe rechten aan. Om het intrekken van de oude vraagt niemand.":"Le nouveau responsable demande les nouveaux droits. Personne ne demande le retrait des anciens.","dag 2 tot 5":"jours 2 à 5","De functioneel beheerders geven de rollen van Handhaving. De rol vergunningverlener blijft staan, net als de teammap van Vergunningen.":"Les administrateurs fonctionnels attribuent les rôles de Contrôle. Le rôle d'instructeur d'autorisations reste en place, tout comme le dossier partagé d'Autorisations.","weken":"semaines","Haar open zaken staan nog op haar naam.":"Ses affaires en cours sont toujours à son nom.","maanden":"mois","Na een jaar heeft Sanne de rechten van twee teams. Dat valt pas op bij een audit.":"Au bout d'un an, Sanne a les droits de deux équipes. On ne s'en aperçoit qu'à l'occasion d'un audit.","een week":"une semaine","Oude rechten blijven staan: rechtenstapeling.":"Les anciens droits restent : accumulation de droits.","dezelfde dag":"le jour même","Geen oude rechten; extra rechten alleen als de leidinggevende ze bevestigt.":"Pas d'anciens droits ; droits supplémentaires uniquement si le responsable les confirme.","Saviynt ziet de overstap: de geboorterechten van Vergunningen gaan eraf, die van Handhaving komen erbij. Extra rechten die ze had, legt Saviynt voor aan de nieuwe leidinggevende: houden of intrekken.":"Saviynt détecte la mobilité : les habilitations de base d'Autorisations sont retirées, celles de Contrôle ajoutées. Les droits supplémentaires qu'elle avait sont soumis au nouveau responsable : conserver ou retirer.","binnen 5 minuten":"en moins de 5 minutes","De groepen in Keycloak veranderen. Bij de volgende vernieuwing van het token kloppen de rollen in elk systeem.":"Les groupes changent dans Keycloak. Au prochain renouvellement du jeton, les rôles sont corrects dans chaque système.","Beleidsbeslispunt":"Point de décision de politique","direct":"immédiatement","Toegang tot stukken van Team Vergunningen hangt af van het team in het token. Daarvoor hoeft niemand een ACL aan te passen.":"L'accès aux documents de l'Équipe Autorisations dépend de l'équipe indiquée dans le jeton. Personne n'a à modifier une ACL.","Het zaaksysteem meldt de open zaken van Sanne aan de teamleider van Vergunningen, om opnieuw toe te wijzen. Dat blijft een besluit van mensen.":"Le système de gestion des affaires signale les affaires en cours de Sanne au chef d'équipe d'Autorisations, pour réattribution. Cela reste une décision humaine.","Leidinggevende":"Responsable","De griffier mailt de servicedesk dat Ilse zegelbevoegd moet worden.":"Le greffier écrit au centre de services qu'Ilse doit être habilitée à sceller.","dag 3":"jour 3","De beheerder van de zegeldienst zet Ilse in een lijst in de configuratie.":"L'administrateur du service de scellement ajoute Ilse à une liste dans la configuration.","—":"—","Niemand legt vast wie het goedkeurde, of wanneer het weer moet vervallen.":"Personne ne consigne qui l'a approuvé, ni quand cela doit expirer.","drie werkdagen":"trois jours ouvrés","Geen spoor van de goedkeuring en geen herziening.":"Aucune trace de l'approbation et aucune révision.","één werkdag":"un jour ouvré","Wie, waarom en tot wanneer: vastgelegd en herzien.":"Qui, pourquoi et jusqu'à quand : consigné et révisé.","De griffier vraagt in Saviynt de bevoegdheid zegelbevoegd aan voor Ilse, met een reden.":"Le greffier demande dans Saviynt l'habilitation « habilité à sceller » pour Ilse, avec un motif.","Saviynt controleert de functiescheiding: wie de zegeldienst beheert, mag niet zelf zegelen.":"Saviynt vérifie la séparation des tâches : qui administre le service de scellement ne peut pas sceller lui-même.","Gemeentesecretaris":"Secrétaire communal","De gemeentesecretaris keurt goed. De bevoegdheid komt elk halfjaar terug in de hercertificering.":"Le secrétaire communal approuve. L'habilitation revient tous les six mois dans la recertification.","Ilse komt in de groep zegelbevoegd. Haar token draagt die rol.":"Ilse rejoint le groupe « habilité à sceller ». Son jeton porte ce rôle.","volgende aanmelding":"prochaine connexion","In het paneel van de Office Assistent ziet Ilse nu de knop Zegel. De zegeldienst controleert de rol en vraagt bij elk zegel de tweede factor.":"Dans le volet de l'Assistant Office, Ilse voit désormais le bouton Cachet. Le service de scellement vérifie le rôle et demande le second facteur pour chaque cachet.","dag −20":"jour −20","HR legt de uitdiensttreding vast.":"Les RH enregistrent le départ.","Op de laatste dag blokkeert de servicedesk het account in Entra ID.":"Le dernier jour, le centre de services bloque le compte dans Entra ID.","uren tot dagen":"des heures à des jours","Sessies die openstaan, blijven werken tot ze verlopen. Lokale accounts in systemen die niet aan Entra ID hangen, blijven bestaan.":"Les sessions ouvertes restent actives jusqu'à leur expiration. Les comptes locaux des systèmes non reliés à Entra ID subsistent.","Per systeem moet een functioneel beheerder het account opheffen. Dat gebeurt als iemand eraan denkt.":"Pour chaque système, un administrateur fonctionnel doit supprimer le compte. Cela se fait quand quelqu'un y pense.","Stukken die alleen op naam van Noor staan, zijn voor niemand meer te vinden.":"Les documents enregistrés uniquement au nom de Noor deviennent introuvables pour tous.","Slapende accounts en stukken zonder eigenaar.":"Comptes dormants et documents sans titulaire.","Geen slapende accounts; elk stuk heeft een eigenaar.":"Aucun compte dormant ; chaque document a un titulaire.","Saviynt plant het intrekken op de laatste werkdag om 17:00 en vraagt de leidinggevende wie haar stukken en taken overneemt.":"Saviynt planifie le retrait le dernier jour de travail à 17 h et demande au responsable qui reprend ses documents et ses tâches.","17:00":"17 h","Op het moment zelf: account uit in Entra ID en Keycloak, alle sessies beëindigd, en een melding aan elk systeem.":"Au moment même : compte désactivé dans Entra ID et Keycloak, toutes les sessions fermées et une notification à chaque système.","Elk systeem trekt de toegang direct in. Tokens die nog bestaan, verlopen binnen vijf minuten.":"Chaque système retire l'accès immédiatement. Les jetons restants expirent en moins de cinq minutes.","XENA-register":"Registre XENA","Het register zet haar stukken op naam van het team. Persoonlijke e-mail blijft afgeschermd; alleen de gemeentesecretaris kan daar toegang toe verlenen.":"Le registre transfère ses documents à l'équipe. Les courriels personnels restent protégés ; seul le secrétaire communal peut en autoriser l'accès.","Haarlem maakt een tweede account voor de collega, met een eigen wachtwoord.":"Haarlem crée un second compte pour le collègue, avec un mot de passe distinct.","dag 2":"jour 2","De functioneel beheerder geeft toegang tot het dossier.":"L'administrateur fonctionnel donne accès au dossier.","Als de collega bij Zandvoort vertrekt, weet Haarlem van niets.":"Si le collègue quitte Zandvoort, Haarlem n'en sait rien.","twee werkdagen":"deux jours ouvrés","Een account dat niemand beheert.":"Un compte que personne ne gère.","Geen tweede account; de toegang vervalt vanzelf.":"Pas de second compte ; l'accès expire de lui-même.","Keycloak vertrouwt de identiteitsdienst van Zandvoort. De collega meldt zich aan met het eigen account.":"Keycloak fait confiance au fournisseur d'identité de Zandvoort. Le collègue se connecte avec son propre compte.","De dossiereigenaar in Haarlem vraagt in Saviynt toegang aan voor de collega, voor dit dossier en met een einddatum.":"Le titulaire du dossier à Haarlem demande dans Saviynt un accès pour le collègue, limité à ce dossier et assorti d'une date de fin.","Het beleid geeft toegang tot het gezamenlijke dossier, en tot niets anders.":"La politique donne accès au dossier commun, et à rien d'autre.","Vertrekt de collega bij Zandvoort, dan werkt de aanmelding niet meer. Op de einddatum vervalt de toegang vanzelf.":"Si le collègue quitte Zandvoort, la connexion ne fonctionne plus. À la date de fin, l'accès expire de lui-même.","Opnieuw afspelen":"Rejouer","Team Vergunningen":"Équipe Autorisations","Vergunningverlener, sinds deze week":"Instructeur d'autorisations, depuis cette semaine","medewerker":"agent","vergunningverlener":"instructeur d'autorisations","Zaakvertrouwelijk":"Confidentiel (affaire)","In behandeling":"En cours","In een lopende zaak wijzigt alleen de behandelaar de stukken.":"Dans une affaire en cours, seul l'agent traitant modifie les documents.","Wie mag wat met dit stuk?":"Qui peut faire quoi avec ce document ?","Kies een persoon, een stuk en een handeling. Links het besluit zoals de systemen het nu nemen, met rollen en ACL's. Rechts het besluit van een beleidsbeslispunt dat ook naar het stuk en de zaak kijkt.":"Choisissez une personne, un document et une opération. À gauche, la décision telle que les systèmes la prennent aujourd'hui, avec rôles et ACL. À droite, la décision d'un point de décision de politique qui tient compte aussi du document et de l'affaire.","Persoon":"Personne","Functie":"Fonction","Team":"Équipe","Rollen":"Rôles","Saviynt, in het token van Keycloak":"Saviynt, dans le jeton Keycloak","Stuk":"Document","Aanvraag omgevingsvergunning Hoge Weide":"Demande de permis d'environnement Hoge Weide","Besluit omgevingsvergunning Hoge Weide":"Décision de permis d'environnement Hoge Weide","Raadsvoorstel zonnepark Spaarnwoude":"Proposition au conseil parc solaire Spaarnwoude","Persoonlijk e-mailbericht van Noor":"Courriel personnel de Noor","Vertrouwelijkheid":"Confidentialité","register, classificatie in de Office Assistent":"registre, classification dans l'Assistant Office","Status":"Statut","register":"registre","Persoonsgegevens":"Données à caractère personnel","ja":"oui","Zaak":"Affaire","behandelaar {0}":"agent traitant {0}","zaaksysteem":"système de gestion des affaires","Handeling":"Opération","Lezen":"Lire","Wijzigen":"Modifier","Zegelen":"Sceller","Publiceren":"Publier","Te ruim in het huidige model: de rol geeft toegang, maar het stuk of de zaak rechtvaardigt het niet.":"Trop large dans le modèle actuel : le rôle donne accès, mais le document ou l'affaire ne le justifie pas.","Nu: rollen en ACL's":"Aujourd'hui : rôles et ACL","in elke toepassing apart ingesteld":"configurés séparément dans chaque application","Toegestaan":"Autorisé","Rol vergunningverlener: lezen en schrijven in alle zaken van dit zaaktype.":"Rôle d'instructeur d'autorisations : lecture et écriture dans toutes les affaires de ce type.","Straks: beleid":"Demain : politique","één beslispunt, met rol, eigenschappen en relatie":"un point de décision, avec rôle, attributs et relation","Geweigerd":"Refusé","Vraag aan het beslispunt (AuthZEN)":"Requête au point de décision (AuthZEN)","Antwoord":"Réponse","Het handhavingspunt is het register van XENA. Het stelt de vraag, het beslispunt antwoordt met een besluit en een reden. Welke software beslist, maakt voor het register niet uit.":"Le point d'application est le registre XENA. Il pose la question ; le point de décision répond par une décision et un motif. Le logiciel qui décide importe peu au registre.","Team Ruimte":"Équipe Aménagement","Beleidsmedewerker":"Chargée de mission","Beide modellen komen hier tot hetzelfde besluit.":"Les deux modèles aboutissent ici à la même décision.","Geen rol en geen teammap die toegang geeft.":"Aucun rôle ni dossier partagé d'équipe qui donne accès.","Zaakvertrouwelijk, en geen relatie met de zaak.":"Confidentiel (affaire), et aucune relation avec l'affaire.","Geen rol zegelbevoegd.":"Pas de rôle « habilité à sceller ».","Geen rol publiceren.":"Pas de rôle « publier ».","Vastgesteld":"Arrêté","ja, geanonimiseerde weergave aanwezig":"oui, version anonymisée disponible","Een vastgestelde versie verandert niet. Wie iets wil wijzigen, maakt een nieuwe versie.":"Une version arrêtée ne change pas. Pour modifier quoi que ce soit, on crée une nouvelle version.","Openbaar":"Public","nee":"non","Eigenaar":"Titulaire","Openbaar: elke medewerker.":"Public : tout agent.","Eigenaar van het stuk.":"Titulaire du document.","Persoonlijk":"Personnel","Ontvangen":"Reçu","Persoonlijke berichten vallen buiten zegelen en publiceren.":"Les messages personnels sont exclus du scellement et de la publication.","ACL van de postbus: alleen de eigenaar.":"ACL de la boîte aux lettres : titulaire uniquement.","Persoonlijk bericht: alleen de eigenaar.":"Message personnel : titulaire uniquement.","Vergunningverlener":"Instructeur d'autorisations","Behandelaar van de zaak, volgens het zaaksysteem.":"Agent traitant de l'affaire, selon le système de gestion des affaires.","Behandelaar van de zaak, en de zaak loopt nog.":"Agent traitant de l'affaire, et l'affaire est toujours en cours.","Openbaar stuk: elke medewerker mag lezen.":"Document public : tout agent peut le lire.","Persoonlijk bericht: alleen de eigenaar. Een ander krijgt toegang alleen met een besluit van de gemeentesecretaris.":"Message personnel : titulaire uniquement. Un tiers n'y a accès que sur décision du secrétaire communal.","Lid van het team dat de zaak behandelt.":"Membre de l'équipe qui traite l'affaire.","Griffie":"Greffe","Medewerker griffie":"Agent du greffe","zegelbevoegd":"habilité à sceller","publiceren":"publier","Alleen een vastgesteld stuk wordt gepubliceerd.":"Seul un document arrêté est publié.","Rol publiceren in het publicatieplatform.":"Rôle « publier » dans la plateforme de publication.","Alleen een vastgestelde versie wordt gezegeld.":"Seule une version arrêtée est scellée.","Rol zegelbevoegd in de zegeldienst.":"Rôle « habilité à sceller » dans le service de scellement.","Vastgesteld en geanonimiseerd.":"Arrêté et anonymisé.","Verplichting: alleen de geanonimiseerde weergave wordt gepubliceerd.":"Obligation : seule la version anonymisée est publiée.","Rol zegelbevoegd, en de versie is vastgesteld.":"Rôle « habilité à sceller », et la version est arrêtée.","Verplichting: tweede factor bij het zegelen.":"Obligation : second facteur lors du scellement.","Vastgesteld en openbaar.":"Arrêté et public.","Team Informatievoorziening":"Équipe Systèmes d'information","Functioneel beheerder zaaksysteem":"Administrateur fonctionnel du système de gestion des affaires","beheerder zaaksysteem":"administrateur du système de gestion des affaires","Beheerders zien de metadata, niet de inhoud.":"Les administrateurs voient les métadonnées, pas le contenu.","Beheerders van het zaaksysteem hebben toegang tot alle zaken.":"Les administrateurs du système de gestion des affaires ont accès à toutes les affaires.","Inhoud alleen met een vastgelegde reden en melding aan security (break-glass).":"Contenu uniquement avec un motif consigné et une notification à la sécurité (bris de glace).","Van personeelsdossier tot toegang":"Du dossier du personnel à l'accès","IRIS legt de lagen vast die bepalen wie er mag inloggen en wat iemand daarna mag. Saviynt beheert wie wat mag, Keycloak houdt de sessies bij, en een beslispunt neemt de besluiten op stukken.":"IRIS décrit les couches qui déterminent qui peut se connecter et ce que chacun peut faire ensuite. Saviynt gère qui peut faire quoi, Keycloak suit les sessions, et un point de décision prend les décisions sur les documents.","In dienst, overstap, uit dienst":"Arrivée, mobilité, départ","Leidinggevenden":"Responsables","Vragen extra rechten aan en herzien ze":"Demandent des droits supplémentaires et les révisent","Bron":"Source","Wie er werkt, in welke functie en in welk team.":"Qui travaille ici, dans quelle fonction et dans quelle équipe.","Herzien · bekijk de stappen":"Révision · voir les étapes","Rolmodel":"Modèle de rôles","Geboorterechten per functie; extra rechten per aanvraag":"Habilitations de base par fonction ; droits supplémentaires sur demande","Aanvragen en goedkeuren":"Demande et approbation","Met reden, goedkeurder en einddatum":"Avec motif, approbateur et date de fin","Functiescheiding":"Séparation des tâches","Combinaties die niet mogen":"Combinaisons interdites","Hercertificering":"Recertification","Elk halfjaar, per leidinggevende":"Tous les six mois, par responsable","Provisioning":"Provisionnement","Naar Entra ID en Keycloak; later naar systemen via SCIM":"Vers Entra ID et Keycloak ; plus tard vers les systèmes via SCIM","Identity governance: Saviynt":"Gouvernance des identités : Saviynt","Hier staat wie wat mag, en waarom. Rollen worden hier gewijzigd, nergens anders.":"C'est ici que figure qui peut faire quoi, et pourquoi. Les rôles sont modifiés ici, et nulle part ailleurs.","Aanmelden · bekijk de stappen":"Connexion · voir les étapes","Account":"Compte","Aangemaakt en uitgezet door Saviynt":"Créé et désactivé par Saviynt","Tweede factor":"Second facteur","Authenticator; later ook passkeys":"Authenticator ; plus tard aussi des passkeys","Identiteitsbron: Entra ID":"Source d'identité : Entra ID","Wie iemand is, met wachtwoord en tweede factor. Naar een alternatief wordt gezocht.":"Qui est la personne, avec mot de passe et second facteur. Une alternative est recherchée.","federatie":"fédération","Sessies":"Sessions","Eén keer aanmelden, overal uitloggen":"Une seule connexion, déconnexion partout","Tokens":"Jetons","Met team, functie en rollen als claims":"Avec équipe, fonction et rôles comme claims","Token exchange":"Échange de jetons","Voor de assistent, namens de medewerker":"Pour l'assistant, au nom de l'agent","Omgeving voor inwoners":"Domaine pour les habitants","Apart, met DigiD, voor TINA":"Distinct, avec DigiD, pour TINA","Sessies en tokens: Keycloak":"Sessions et jetons : Keycloak","De enige plek waar systemen hun aanmelding vandaan halen. Daardoor is de identiteitsbron te vervangen.":"Le seul endroit d'où les systèmes tirent leur authentification. La source d'identité devient ainsi remplaçable.","Toegangsbeslissing · bekijk de stappen":"Décision d'accès · voir les étapes","Beslispunt":"Point de décision","Neemt besluiten met reden; de software is vervangbaar":"Prend des décisions motivées ; le logiciel est remplaçable","Beleid als code":"Politique sous forme de code","In git, met review en tests":"Dans git, avec revue et tests","Informatiebronnen":"Sources d'information","Token, register, zaaksysteem":"Jeton, registre, système de gestion des affaires","Autorisatie, straks: beslispunt":"Autorisation, demain : point de décision","Eén plek voor de regels, als code. Elke toepassing vraagt het besluit via AuthZEN.":"Un seul endroit pour les règles, sous forme de code. Chaque application demande la décision via AuthZEN.","Namens de medewerker · bekijk de stappen":"Au nom de l'agent · voir les étapes","XENA-register en opslag":"Registre et stockage XENA","Het handhavingspunt voor stukken":"Le point d'application pour les documents","Office Assistent":"Assistant Office","Altijd namens de medewerker":"Toujours au nom de l'agent","ELSA en MAIA":"ELSA et MAIA","E-mail en chat; persoonlijk blijft afgeschermd":"Courriel et chat ; le personnel reste protégé","VERA":"VERA","Rol zegelbevoegd, met tweede factor per zegel":"Rôle « habilité à sceller », avec second facteur par cachet","Blijft leidend voor wie welke zaak behandelt":"Reste la référence pour savoir qui traite quelle affaire","Toepassingen uit de demo's":"Applications des démos","Elk handhaaft het besluit; geen eigen lijsten van wie wat mag.":"Chacune applique la décision ; pas de listes propres de qui peut faire quoi.","Uit dienst · bekijk de stappen":"Départ · voir les étapes","Auditlog en SIEM":"Journal d'audit et SIEM","Elk besluit, elke wijziging van rechten":"Chaque décision, chaque modification de droits","CISO":"RSSI","Verslagen van hercertificering, voor de BIO":"Rapports de recertification, pour la BIO","Toezicht":"Supervision","Wat er gebeurt bij een handeling":"Ce qui se passe lors d'une opération","Kies een handeling. De stappen laten zien welk onderdeel wat doet.":"Choisissez une opération. Les étapes montrent quel composant fait quoi.","Aanmelden":"Connexion","De assistent handelt namens de medewerker":"L'assistant agit au nom de l'agent","Een toegangsbeslissing":"Une décision d'accès","Uit dienst: sessies beëindigen":"Départ : fermer les sessions","Een inwoner bij TINA":"Un habitant sur TINA","Noor opent de Office Assistent. Die stuurt haar door naar Keycloak.":"Noor ouvre l'Assistant Office. Celui-ci la redirige vers Keycloak.","Keycloak stuurt door naar Entra ID voor wachtwoord en tweede factor.":"Keycloak redirige vers Entra ID pour le mot de passe et le second facteur.","Entra ID bevestigt wie Noor is. Entra ID is de identiteitsbron, niet de plek van de sessie.":"Entra ID confirme qui est Noor. Entra ID est la source d'identité, pas le lieu de la session.","Keycloak maakt de sessie en geeft een token met wie ze is, haar team en haar rollen. Het token is vijf minuten geldig en wordt stil vernieuwd.":"Keycloak crée la session et émet un jeton indiquant qui elle est, son équipe et ses rôles. Le jeton est valable cinq minutes et se renouvelle en silence.","De assistent toont alleen de functies die bij die rollen horen.":"L'assistant n'affiche que les fonctions correspondant à ces rôles.","Open punten":"Points ouverts","Saviynt is een clouddienst":"Saviynt est un service cloud","Saviynt draait als dienst van een Amerikaanse leverancier en bevat wie er werkt en wat ieder mag. Dat schuurt met het zoeken naar alternatieven voor Entra ID. Een bewuste afweging is nodig, met afspraken over waar de gegevens staan.":"Saviynt fonctionne comme service d'un fournisseur américain et contient qui travaille ici et ce que chacun peut faire. Cela entre en tension avec la recherche d'alternatives à Entra ID. Un arbitrage conscient s'impose, avec des accords sur le lieu de stockage des données.","Keycloak wordt een kritieke schakel":"Keycloak devient un maillon critique","Als Keycloak niet werkt, kan niemand aanmelden. Dat vraagt hoge beschikbaarheid, eigen beheer en een vast moment voor updates.":"Si Keycloak ne fonctionne pas, personne ne peut se connecter. Cela exige une haute disponibilité, une exploitation en propre et un créneau fixe pour les mises à jour.","Eén plek voor rollen":"Un seul endroit pour les rôles","Rollen veranderen in Saviynt, nooit met de hand in Keycloak of in een toepassing. Anders lopen de twee uit elkaar en klopt de hercertificering niet meer.":"Les rôles changent dans Saviynt, jamais à la main dans Keycloak ou dans une application. Sinon les deux divergent et la recertification n'est plus fiable.","Het zaaksysteem blijft leidend":"Le système de gestion des affaires reste la référence","Wie welke zaak behandelt, staat in het zaaksysteem. IAM levert rol en team; het beslispunt vraagt de relatie met de zaak op, en neemt die niet over.":"Qui traite quelle affaire figure dans le système de gestion des affaires. L'IAM fournit le rôle et l'équipe ; le point de décision interroge la relation avec l'affaire, sans la reprendre.","Geen beleid zonder metadata":"Pas de politique sans métadonnées","Een besluit op vertrouwelijkheid of persoonsgegevens kan alleen als het stuk geclassificeerd is. Classificeren in de Office Assistent is dus een voorwaarde, geen extra.":"Une décision fondée sur la confidentialité ou les données à caractère personnel n'est possible que si le document est classifié. Classifier dans l'Assistant Office est donc un prérequis, pas un bonus.","Wat nog experimenteel is":"Ce qui reste expérimental","SCIM in Keycloak (vanaf versie 26.6) en Shared Signals in Keycloak zijn experimenteel. Het ontwerp leunt er pas op als ze stabiel zijn.":"SCIM dans Keycloak (à partir de la version 26.6) et Shared Signals dans Keycloak sont expérimentaux. La conception ne s'y appuiera qu'une fois qu'ils seront stables.","Noor kiest in het paneel Classificeren. De assistent moet daarvoor het register aanroepen.":"Noor choisit Classifier dans le volet. Pour cela, l'assistant doit appeler le registre.","De assistent ruilt het token van Noor in voor een token voor het register (token exchange). Dat token zegt: de assistent, namens Noor.":"L'assistant échange le jeton de Noor contre un jeton pour le registre (token exchange). Ce jeton dit : l'assistant, au nom de Noor.","Het register vraagt het beslispunt of Noor dit stuk mag classificeren.":"Le registre demande au point de décision si Noor peut classifier ce document.","Het register voert het uit en legt vast: Noor, via de assistent.":"Le registre l'exécute et consigne : Noor, via l'assistant.","De assistent heeft zelf geen rechten op stukken. Wat Noor niet mag, kan de assistent ook niet.":"L'assistant n'a aucun droit propre sur les documents. Ce que Noor ne peut pas faire, l'assistant ne le peut pas non plus.","Daan opent een aanvraag omgevingsvergunning. Het register is het handhavingspunt.":"Daan ouvre une demande de permis d'environnement. Le registre est le point d'application.","Het register stelt de vraag via AuthZEN: deze persoon, deze handeling, dit stuk.":"Le registre pose la question via AuthZEN : cette personne, cette opération, ce document.","Het beslispunt haalt wat het nodig heeft: rol en team uit het token, vertrouwelijkheid en status uit het register, de behandelaar uit het zaaksysteem.":"Le point de décision récupère ce dont il a besoin : rôle et équipe dans le jeton, confidentialité et statut dans le registre, l'agent traitant dans le système de gestion des affaires.","Het beleid, als code in git, geeft het besluit met de reden.":"La politique, sous forme de code dans git, rend la décision avec son motif.","Het register toont het stuk, of niet, en legt het besluit vast.":"Le registre affiche le document, ou non, et consigne la décision.","Saviynt zet het account uit in Entra ID en Keycloak.":"Saviynt désactive le compte dans Entra ID et Keycloak.","Keycloak beëindigt alle sessies en meldt dat aan de systemen (back-channel logout).":"Keycloak ferme toutes les sessions et en informe les systèmes (back-channel logout).","Elk systeem gooit de sessie weg. Later ook via een signaal volgens Shared Signals, zodra Keycloak dat stabiel ondersteunt.":"Chaque système supprime la session. Plus tard aussi via un signal Shared Signals, dès que Keycloak le prendra en charge de façon stable.","Het auditlog legt vast wanneer welke toegang verviel.":"Le journal d'audit consigne quand quel accès a pris fin.","Elk halfjaar legt Saviynt aan elke leidinggevende voor wie welke extra rechten heeft.":"Tous les six mois, Saviynt présente à chaque responsable qui détient quels droits supplémentaires.","De leidinggevende bevestigt of trekt in. Geen antwoord betekent intrekken.":"Le responsable confirme ou retire. Sans réponse, le droit est retiré.","Ingetrokken rechten verdwijnen uit de groepen in Keycloak.":"Les droits retirés disparaissent des groupes de Keycloak.","Het verslag gaat naar de CISO, als bewijs voor de BIO.":"Le rapport est transmis au RSSI, comme preuve pour la BIO.","TINA":"TINA","Een inwoner wil een eigen stuk downloaden.":"Un habitant veut télécharger l'un de ses propres documents.","Een aparte omgeving in Keycloak, alleen voor inwoners, stuurt door naar DigiD.":"Un domaine distinct dans Keycloak, réservé aux habitants, redirige vers DigiD.","DigiD":"DigiD","DigiD bevestigt wie de inwoner is.":"DigiD confirme qui est l'habitant.","Het beleid geeft de inwoner alleen de eigen stukken en openbare stukken.":"La politique ne donne à l'habitant que ses propres documents et les documents publics.","Inwoners staan niet in Saviynt en krijgen geen rollen. Hun toegang volgt uit wie ze zijn.":"Les habitants ne figurent pas dans Saviynt et n'ont pas de rôles. Leur accès découle de leur identité.","Rollen per zaaktype":"Rôles par type d'affaire","Nextcloud-stack":"Pile Nextcloud","Deelrechten op mappen":"Droits de partage sur les dossiers","Mailarchief":"Archive de messagerie","Rechten op postbussen":"Droits sur les boîtes aux lettres","Zegeldienst":"Service de scellement","Een lijst in de configuratie":"Une liste dans la configuration","Autorisatie, nu":"Autorisation, aujourd'hui","Elke toepassing beslist zelf, met eigen rollen en ACL's die functioneel beheer met de hand bijhoudt.":"Chaque application décide seule, avec ses propres rôles et ACL tenus à jour à la main par l'administration fonctionnelle.","De technische opbouw":"L’architecture technique","Drie vragen, drie plekken. Wie mag wat: Saviynt. Wie is dit en is de sessie nog geldig: Entra ID en Keycloak. Mag dit nu, met dit stuk: het beslispunt. Wat als kandidaat staat, is een voorstel om te toetsen.":"Trois questions, trois endroits. Qui peut faire quoi : Saviynt. Qui est-ce, et la session est-elle encore valide : Entra ID et Keycloak. Est-ce permis maintenant, avec ce document : le point de décision. Ce qui est indiqué comme candidat est une proposition à évaluer.","Componenten en technologie":"Composants et technologie","Onderdeel":"Composant","Technologie":"Technologie","Waar":"Où","Identity governance":"Gouvernance des identités","Saviynt Identity Cloud":"Saviynt Identity Cloud","Clouddienst":"Service cloud","Uitgangspunt":"Principe","Identiteitsbron en tweede factor":"Source d'identité et second facteur","Microsoft Entra ID; een alternatief wordt gezocht":"Microsoft Entra ID ; une alternative est recherchée","Sessies en tokens":"Sessions et jetons","Keycloak, open source":"Keycloak, open source","Eigen datacenter, hoog beschikbaar":"Centre de données propre, haute disponibilité","Kandidaat":"Candidat","Open Policy Agent, Cedar of OpenFGA, achter de AuthZEN-interface":"Open Policy Agent, Cedar ou OpenFGA, derrière l'interface AuthZEN","Eigen datacenter, dicht bij elk handhavingspunt":"Centre de données propre, à proximité de chaque point d'application","Git, met review en geautomatiseerde tests":"Git, avec revue et tests automatisés","Eigen beheer":"En gestion propre","Auditlog":"Journal d'audit","De bestaande SIEM":"Le SIEM existant","Per systeem uit de demo's":"Par système des démos","Hoe elk systeem aanmeldt, waar de rollen vandaan komen en wat functioneel beheer nog doet.":"Comment chaque système gère la connexion, d'où viennent les rôles et ce que fait encore l'administration fonctionnelle.","Systeem":"Système","Rollen komen binnen via":"Les rôles arrivent via","Fijnmazig":"Granularité fine","Wat functioneel beheer nog doet":"Ce que fait encore l'administration fonctionnelle","OpenID Connect via Keycloak":"OpenID Connect via Keycloak","Claims in het token":"Claims dans le jeton","Het register vraagt het beslispunt (AuthZEN)":"Le registre interroge le point de décision (AuthZEN)","Niets voor toegang; wel het beleid mee opstellen.":"Rien pour l'accès ; mais contribue à rédiger la politique.","De OpenID Connect-app van Nextcloud":"L'application OpenID Connect de Nextcloud","Groepen uit het token, bij elke aanmelding bijgewerkt; opheffen via de provisioning-API":"Groupes issus du jeton, mis à jour à chaque connexion ; suppression via l'API de provisionnement","Via het register, niet via deelrechten op mappen":"Via le registre, pas via des droits de partage sur les dossiers","Groepen één keer koppelen aan rollen.":"Associer une fois les groupes aux rôles.","Office Assistent (MIRA)":"Assistant Office (MIRA)","Token van de kantoorapplicatie, ingeruild bij Keycloak (RFC 8693)":"Jeton de l'application bureautique, échangé auprès de Keycloak (RFC 8693)","Claims; de assistent toont alleen wat bij de rollen hoort":"Claims ; l'assistant n'affiche que ce qui correspond aux rôles","Altijd namens de medewerker, zonder eigen rechten op stukken":"Toujours au nom de l'agent, sans droits propres sur les documents","Niets.":"Rien.","E-mailarchief (ELSA)":"Archive de courriels (ELSA)","IMAP met een token (OAUTHBEARER, RFC 7628)":"IMAP avec un jeton (OAUTHBEARER, RFC 7628)","Claims; gedeelde postbussen als rol":"Claims ; boîtes partagées sous forme de rôle","Persoonlijke berichten: alleen de eigenaar, toegang voor een ander alleen met besluit van de gemeentesecretaris":"Messages personnels : titulaire uniquement ; accès pour un tiers seulement sur décision du secrétaire communal","Gedeelde postbussen als rol beschrijven.":"Décrire les boîtes partagées sous forme de rôles.","Chatarchief (MAIA)":"Archive de chat (MAIA)","OpenID Connect":"OpenID Connect","Claims":"Claims","Via het register":"Via le registre","Zegeldienst (VERA)":"Service de scellement (VERA)","OpenID Connect, met tweede factor per zegel":"OpenID Connect, avec second facteur par cachet","Rol zegelbevoegd, aangevraagd en goedgekeurd in Saviynt":"Rôle « habilité à sceller », demandé et approuvé dans Saviynt","Beleid: alleen vastgestelde versies":"Politique : versions arrêtées uniquement","Niets; de lijst in de configuratie vervalt.":"Rien ; la liste dans la configuration disparaît.","Saviynt beheert de rollen per zaaktype, via een connector (REST, later SCIM)":"Saviynt gère les rôles par type d'affaire, via un connecteur (REST, plus tard SCIM)","Blijft leidend voor wie welke zaak behandelt, en levert die relatie aan het beslispunt":"Reste la référence pour savoir qui traite quelle affaire, et fournit cette relation au point de décision","Zaken toewijzen en rollen per zaaktype inrichten.":"Attribuer les affaires et configurer les rôles par type d'affaire.","Zoekportaal (TINA)":"Portail de recherche (TINA)","Aparte omgeving in Keycloak, met DigiD":"Domaine distinct dans Keycloak, avec DigiD","Geen rollen: inwoners staan niet in Saviynt":"Pas de rôles : les habitants ne figurent pas dans Saviynt","Eigen stukken en openbare stukken":"Documents propres et documents publics","Van RBAC naar beleid":"Du RBAC à la politique","Geen keuze voor één model: beleid combineert ze. De overstap kan per systeem, zonder dat de toepassing verandert.":"Pas de choix d'un modèle unique : la politique les combine. La transition peut se faire système par système, sans que l'application change.","Model":"Modèle","Wat beslist":"Ce qui décide","Sterk":"Atouts","Zwak":"Faiblesses","RBAC":"RBAC","De rol van de persoon":"Le rôle de la personne","Eenvoudig, en goed te herzien in Saviynt":"Simple, et facile à réviser dans Saviynt","Grof: een rol geeft toegang tot alles van een soort. Rollen stapelen, en elke uitzondering wordt een nieuwe rol.":"Grossier : un rôle donne accès à tout ce qui est d'un même type. Les rôles s'accumulent, et chaque exception devient un nouveau rôle.","ABAC":"ABAC","Eigenschappen van persoon, stuk en situatie":"Attributs de la personne, du document et du contexte","Fijnmazig zonder een explosie van rollen; volgt de metadata":"Granularité fine sans explosion des rôles ; suit les métadonnées","Vraagt betrouwbare metadata. Een besluit is lastiger uit te leggen.":"Exige des métadonnées fiables. Une décision est plus difficile à expliquer.","ReBAC":"ReBAC","De relatie tussen persoon en stuk, zoals behandelaar van een zaak":"La relation entre la personne et le document, par exemple agent traitant d'une affaire","Past bij zaakgericht werken; de relaties komen uit het zaaksysteem":"Adapté au travail par affaires ; les relations viennent du système de gestion des affaires","Vraagt een actuele kopie van die relaties, of een snelle bevraging.":"Exige une copie à jour de ces relations, ou une interrogation rapide.","PBAC":"PBAC","Beleid als code dat rol, eigenschappen en relaties combineert":"Politique sous forme de code combinant rôle, attributs et relations","Eén plek voor de regels, te testen, met een reden bij elk besluit":"Un seul endroit pour les règles, testable, avec un motif pour chaque décision","Een extra onderdeel bij elke aanvraag. Beschikbaarheid en snelheid worden kritiek.":"Un composant de plus à chaque requête. Disponibilité et rapidité deviennent critiques.","Ontwerpregels":"Règles de conception","Rollen veranderen alleen in Saviynt. Wie in Keycloak of in een toepassing met de hand iets wijzigt, ziet het bij de volgende synchronisatie verdwijnen.":"Les rôles ne changent que dans Saviynt. Toute modification manuelle dans Keycloak ou dans une application disparaît à la synchronisation suivante.","Tokens zijn kort geldig, vijf minuten. Intrekken werkt dan ook voor systemen die geen melding verwerken.":"Les jetons ont une courte durée de validité : cinq minutes. Le retrait fonctionne ainsi aussi pour les systèmes qui ne traitent pas de notification.","Een assistent of een automatisch proces heeft een eigen identiteit, met zo weinig rechten als kan. Handelt het namens een medewerker, dan met diens token.":"Un assistant ou un processus automatisé a sa propre identité, avec le moins de droits possible. S'il agit au nom d'un agent, c'est avec le jeton de celui-ci.","Elk besluit heeft een reden, en die komt in het auditlog.":"Chaque décision a un motif, consigné dans le journal d'audit.","Inwoners en medewerkers staan in aparte omgevingen. Een fout in de een raakt de ander niet.":"Habitants et agents sont dans des domaines distincts. Une erreur dans l'un n'affecte pas l'autre.","Standaarden":"Normes","SCIM 2.0":"SCIM 2.0","RFC 7643 en 7644":"RFC 7643 et 7644","Accounts en groepen aanmaken, wijzigen en opheffen. Keycloak krijgt een SCIM-server, experimenteel vanaf versie 26.6.":"Créer, modifier et supprimer des comptes et des groupes. Keycloak se dote d'un serveur SCIM, expérimental à partir de la version 26.6.","OpenID NLGov-profiel (Logius)":"Profil OpenID NLGov (Logius)","Aanmelden en identiteitstokens.":"Connexion et jetons d'identité.","OAuth 2.0":"OAuth 2.0","NL GOV Assurance profile (Logius)":"NL GOV Assurance profile (Logius)","Tokens voor API's binnen de overheid.":"Jetons pour les API au sein de l'administration.","RFC 8693":"RFC 8693","Een assistent handelt namens de medewerker, met diens rechten.":"Un assistant agit au nom de l'agent, avec les droits de celui-ci.","AuthZEN":"AuthZEN","Authorization API 1.0, OpenID Foundation, definitief sinds januari 2026":"Authorization API 1.0, OpenID Foundation, définitive depuis janvier 2026","Eén interface tussen handhavingspunt en beslispunt. Het beslispunt is zo te vervangen.":"Une seule interface entre point d'application et point de décision. Le point de décision devient ainsi remplaçable.","Shared Signals en CAEP":"Shared Signals et CAEP","OpenID Foundation, definitief sinds september 2025":"OpenID Foundation, définitive depuis septembre 2025","Een melding bij intrekking, direct naar elk systeem. In Keycloak nog experimenteel.":"Une notification lors d'un retrait, directement à chaque système. Encore expérimental dans Keycloak.","OAUTHBEARER":"OAUTHBEARER","RFC 7628":"RFC 7628","Aanmelden bij IMAP met een token in plaats van een wachtwoord.":"Connexion à IMAP avec un jeton au lieu d'un mot de passe.","BIO":"BIO","Baseline Informatiebeveiliging Overheid, op basis van ISO 27002":"Baseline Informatiebeveiliging Overheid (référentiel néerlandais de sécurité de l'information), fondé sur l'ISO 27002","Toegangsbeheer: identiteiten, rechten en het herzien ervan.":"Contrôle d'accès : identités, droits et leur révision.","Passkeys":"Passkeys","W3C WebAuthn en FIDO2":"W3C WebAuthn et FIDO2","Een tweede factor die niet afhangt van één leverancier.":"Un second facteur qui ne dépend pas d'un seul fournisseur.","Van handwerk naar beleid":"Du travail manuel à la politique","Concept. Dit is een volgorde, geen planning. Elke stap levert iets op, en geen stap vraagt dat een toepassing anders gaat werken voor de medewerker.":"Projet. Il s'agit d'un ordre, pas d'un calendrier. Chaque étape apporte quelque chose, et aucune n'exige qu'une application fonctionne autrement pour l'agent.","stap {0}":"étape {0}","Zelf te doen":"À faire nous-mêmes","Rolcatalogus voor de demo-systemen":"Catalogue de rôles pour les systèmes des démos","eerst":"d'abord","Wat functioneel beheer merkt":"Ce que remarque l'administration fonctionnelle","Een inventaris van de rollen in elk systeem, en per functie welke rollen erbij horen.":"Un inventaire des rôles de chaque système et, par fonction, des rôles qui s'y rattachent.","Wat het platform moet kunnen":"Ce que la plateforme doit savoir faire","Niets nieuws. Saviynt leest de bestaande rollen in.":"Rien de nouveau. Saviynt importe les rôles existants.","Wat het van leveranciers vraagt":"Ce que cela demande aux fournisseurs","Medewerking van functioneel beheer en de teamleiders.":"La coopération de l'administration fonctionnelle et des chefs d'équipe.","Per functie een set geboorterechten, vastgesteld door de leidinggevenden.":"Par fonction, un ensemble d'habilitations de base, arrêté par les responsables.","Aanmelden via Keycloak":"Connexion via Keycloak","daarna":"ensuite","Geen accounts meer aanmaken: systemen maken ze zelf bij de eerste aanmelding, met de rollen uit het token.":"Plus de création de comptes : les systèmes les créent eux-mêmes à la première connexi
