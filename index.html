on, avec les rôles du jeton.","Keycloak hoog beschikbaar, met Entra ID als identiteitsbron erachter. Elk systeem gebruikt OpenID Connect.":"Keycloak en haute disponibilité, avec Entra ID derrière comme source d'identité. Chaque système utilise OpenID Connect.","Systemen die OpenID Connect ondersteunen, met rollen uit claims.":"Des systèmes compatibles OpenID Connect, avec des rôles issus des claims.","Alle demo-systemen melden aan via Keycloak.":"Tous les systèmes des démos se connectent via Keycloak.","Saviynt provisioneert":"Saviynt provisionne","In dienst, overstap en uit dienst gaan vanzelf. Geen tickets meer per systeem voor de geboorterechten.":"Arrivées, mobilités et départs se font tout seuls. Plus de tickets par système pour les habilitations de base.","Koppelingen van Saviynt naar Entra ID en Keycloak. Uit dienst binnen vijf minuten, met beëindigde sessies.":"Connecteurs de Saviynt vers Entra ID et Keycloak. Départ effectif en moins de cinq minutes, sessions fermées.","Een betrouwbare koppeling met Keycloak; de connector van Saviynt is een communityversie.":"Un connecteur fiable vers Keycloak ; celui de Saviynt est une version communautaire.","Geen slapende accounts meer in de demo-systemen.":"Plus de comptes dormants dans les systèmes des démos.","Aanvragen en herzien":"Demande et révision","Extra rechten, zoals zegelbevoegd of een gedeelde postbus, gaan via een aanvraag met goedkeuring. Elk halfjaar herzien.":"Les droits supplémentaires, comme « habilité à sceller » ou une boîte partagée, passent par une demande avec approbation. Révisés tous les six mois.","Werkstromen in Saviynt, met functiescheiding.":"Flux de travail dans Saviynt, avec séparation des tâches.","Niets bijzonders.":"Rien de particulier.","Elke extra bevoegdheid heeft een goedkeurder en een herziening.":"Chaque habilitation supplémentaire a un approbateur et une révision.","Besluiten naar het beslispunt":"Les décisions au point de décision","Nog niets: de regels van nu gaan één op één over naar beleid als code, eerst alleen meekijkend.":"Rien pour l'instant : les règles actuelles passent telles quelles en politique sous forme de code, d'abord en simple observation.","Het register als handhavingspunt, met AuthZEN. Het beslispunt draait naast het register.":"Le registre comme point d'application, avec AuthZEN. Le point de décision fonctionne à côté du registre.","Een beslispunt dat AuthZEN spreekt.":"Un point de décision qui parle AuthZEN.","Het beslispunt neemt dezelfde besluiten als de systemen zelf, aantoonbaar.":"Le point de décision prend, de façon démontrable, les mêmes décisions que les systèmes eux-mêmes.","Eigenschappen en relaties":"Attributs et relations","ACL's verdwijnen. Toegang volgt uit de vertrouwelijkheid van het stuk en de relatie met de zaak.":"Les ACL disparaissent. L'accès découle de la confidentialité du document et de la relation avec l'affaire.","Classificatie uit de Office Assistent in het register; de behandelaar uit het zaaksysteem.":"La classification de l'Assistant Office dans le registre ; l'agent traitant depuis le système de gestion des affaires.","Een zaaksysteem dat de relatie met een zaak snel kan geven.":"Un système de gestion des affaires capable de fournir rapidement la relation avec une affaire.","Geen ACL's meer in XENA en de Nextcloud-stack.":"Plus d'ACL dans XENA et la pile Nextcloud.","Afhankelijk van de markt":"Dépend du marché","Meldingen bij intrekken":"Notifications lors du retrait","later":"plus tard","Niets: intrekken gaat nog sneller, ook bij een verloren laptop.":"Rien : le retrait est encore plus rapide, y compris en cas d'ordinateur portable perdu.","Shared Signals en CAEP tussen Keycloak en de systemen.":"Shared Signals et CAEP entre Keycloak et les systèmes.","Stabiele ondersteuning in Keycloak en in de systemen.":"Une prise en charge stable dans Keycloak et dans les systèmes.","Een ingetrokken sessie stopt in seconden, overal.":"Une session retirée s'arrête en quelques secondes, partout.","Identiteitsbron vervangbaar":"Source d'identité remplaçable","Een andere manier van aanmelden, bijvoorbeeld met een passkey. Verder niets.":"Une autre façon de se connecter, par exemple avec une passkey. Rien d'autre.","Een andere identiteitsbron achter Keycloak; samenwerking met Zandvoort via federatie.":"Une autre source d'identité derrière Keycloak ; collaboration avec Zandvoort par fédération.","Een alternatief voor Entra ID dat Saviynt kan voeden.":"Une alternative à Entra ID que Saviynt peut alimenter.","Entra ID is te vervangen zonder dat een systeem verandert.":"Entra ID peut être remplacé sans qu'aucun système ne change.","Waarom met de demo-systemen beginnen":"Pourquoi commencer par les systèmes des démos","Ze zijn nieuw of worden nieuw ingericht. Er is geen erfenis van ACL's om op te ruimen.":"Ils sont nouveaux ou en cours de mise en place. Il n'y a pas d'héritage d'ACL à nettoyer.","Ze delen één register. Eén handhavingspunt dekt opslag, e-mail, chat en zegels.":"Ils partagent un même registre. Un seul point d'application couvre stockage, courriel, chat et cachets.","Wat werkt, is daarna een voorbeeld voor het zaaksysteem en de andere applicaties.":"Ce qui fonctionne sert ensuite d'exemple pour le système de gestion des affaires et les autres applications.","Waar het kan schuren":"Points de friction","Een rolmodel vraagt dat teamleiders vastleggen wat bij een functie hoort. Dat is organisatiewerk, geen techniek.":"Un modèle de rôles exige que les chefs d'équipe définissent ce qui relève d'une fonction. C'est un travail d'organisation, pas de technique.","Wie gewend is rechten te kopiëren van een collega, ervaart een aanvraag met goedkeuring als trager.":"Qui a l'habitude de copier les droits d'un collègue trouvera une demande avec approbation plus lente.","Beleid op eigenschappen werkt alleen met geclassificeerde stukken. Oude stukken zonder classificatie vallen terug op de regels van nu.":"Une politique fondée sur les attributs ne fonctionne qu'avec des documents classifiés. Les anciens documents non classifiés retombent sur les règles actuelles.","IRIS laat zien hoe gebruikersbeheer voor de systemen uit de demo's te automatiseren is: van het personeelsdossier tot het besluit op een stuk. Voor IT-beheer, security en architecten.":"IRIS montre comment automatiser la gestion des utilisateurs pour les systèmes des démos : du dossier du personnel à la décision sur un document. Pour l'exploitation informatique, la sécurité et les architectes.","Weergaven":"Vues","In dienst, overstap, extra bevoegdheid, uit dienst en samenwerking: stap voor stap, nu met de hand en straks geautomatiseerd.":"Arrivée, mobilité, habilitation supplémentaire, départ et collaboration : étape par étape, à la main aujourd'hui et automatisé demain.","Open deze weergave":"Ouvrir cette vue","Kies een persoon, een stuk en een handeling. Zie het besluit van nu naast dat van een beleidsbeslispunt, met de AuthZEN-vraag erbij.":"Choisissez une personne, un document et une opération. Voyez la décision actuelle à côté de celle d'un point de décision de politique, avec la requête AuthZEN.","De lagen van personeelsdossier tot toegang, en de stappen bij aanmelden, handelen namens, beslissen, uit dienst en herzien.":"Les couches du dossier du personnel à l'accès, et les étapes de connexion, d'action au nom d'autrui, de décision, de départ et de révision.","Componenten, de koppeling per systeem uit de demo's, de modellen van RBAC tot beleid, ontwerpregels en standaarden.":"Composants, l'intégration par système des démos, les modèles du RBAC à la politique, règles de conception et normes.","Acht stappen, beginnend met een rolcatalogus voor de demo-systemen.":"Huit étapes, en commençant par un catalogue de rôles pour les systèmes des démos.","Makers, licentie en contact staan in het colofon, onder de titel.":"Les auteurs, la licence et le contact figurent dans le colophon, sous le titre.","Colofon openen":"Ouvrir le colophon","De schakelaar":"Le commutateur","Nu, met de hand per systeem, of straks, geautomatiseerd. De situatie verandert de stappen in Levenscyclus en de autorisatielaag in Architectuur.":"Aujourd'hui, à la main système par système, ou demain, automatisé. La situation modifie les étapes du Cycle de vie et la couche d'autorisation de l'Architecture.","De regel onderaan toont wat er technisch gebeurt bij een handeling.":"La ligne du bas montre ce qui se passe techniquement lors d'une opération.","Veelgestelde vragen":"Questions fréquentes","Zoek in de vragen":"Rechercher dans les questions","Begrippen":"Notions","Wat is het verschil tussen Saviynt en Keycloak?":"Quelle est la différence entre Saviynt et Keycloak ?","Saviynt bepaalt wie wat mag en waarom: rollen, aanvragen, herzieningen. Keycloak voert het uit bij elke aanmelding: sessies en tokens. Rollen veranderen in Saviynt, nooit in Keycloak.":"Saviynt détermine qui peut faire quoi et pourquoi : rôles, demandes, révisions. Keycloak l'applique à chaque connexion : sessions et jetons. Les rôles changent dans Saviynt, jamais dans Keycloak.","Waarom Keycloak tussen Entra ID en de systemen?":"Pourquoi Keycloak entre Entra ID et les systèmes ?","Zodat de systemen niet aan Entra ID vastzitten. Wordt Entra ID vervangen, dan verandert alleen de koppeling achter Keycloak.":"Pour que les systèmes ne soient pas liés à Entra ID. Si Entra ID est remplacé, seule la liaison derrière Keycloak change.","Wat is een geboorterecht?":"Qu'est-ce qu'une habilitation de base ?","De rechten die iemand krijgt door zijn functie, zonder aanvraag. Alles daarboven is een extra recht, met een aanvraag, een goedkeurder en een herziening.":"Les droits qu'une personne obtient du fait de sa fonction, sans demande. Tout ce qui va au-delà est un droit supplémentaire, avec une demande, un approbateur et une révision.","Beheer":"Administration","Verdwijnt het werk van functioneel beheer?":"Le travail de l'administration fonctionnelle disparaît-il ?","Het handwerk wel: accounts aanmaken en rechten toekennen per ticket. Wat blijft, is inhoudelijk: rollen koppelen, zaken toewijzen, het beleid mee opstellen en uitzonderingen beoordelen.":"Le travail manuel, oui : créer des comptes et attribuer des droits par ticket. Ce qui reste porte sur le fond : associer les rôles, attribuer les affaires, contribuer à la politique et évaluer les exceptions.","Wie beslist wie zegelbevoegd is?":"Qui décide qui est habilité à sceller ?","De gemeentesecretaris, via een aanvraag in Saviynt. De zegeldienst kijkt alleen naar de rol in het token.":"Le secrétaire communal, via une demande dans Saviynt. Le service de scellement ne regarde que le rôle dans le jeton.","Beveiliging":"Sécurité","Hoe snel is iemand die vertrekt eruit?":"En combien de temps une personne qui part perd-elle l'accès ?","Op het geplande moment gaat het account uit en eindigen alle sessies. Tokens zijn vijf minuten geldig, dus binnen vijf minuten werkt niets meer.":"Au moment prévu, le compte est désactivé et toutes les sessions se ferment. Les jetons sont valables cinq minutes : en moins de cinq minutes, plus rien ne fonctionne.","Heeft de Office Assistent eigen rechten?":"L'Assistant Office a-t-il des droits propres ?","Nee. De assistent handelt altijd namens de medewerker, met een ingeruild token. Wat de medewerker niet mag, kan de assistent ook niet.":"Non. L'assistant agit toujours au nom de l'agent, avec un jeton échangé. Ce que l'agent ne peut pas faire, l'assistant ne le peut pas non plus.","Mag een beheerder alles zien?":"Un administrateur peut-il tout voir ?","Een beheerder ziet de metadata. De inhoud alleen met een vastgelegde reden en een melding aan security.":"Un administrateur voit les métadonnées. Le contenu, seulement avec un motif consigné et une notification à la sécurité.","Neemt IAM de rechten van het zaaksysteem over?":"L'IAM reprend-il les droits du système de gestion des affaires ?","Nee. Het zaaksysteem blijft leidend voor wie welke zaak behandelt. Het beslispunt vraagt die relatie op.":"Non. Le système de gestion des affaires reste la référence pour savoir qui traite quelle affaire. Le point de décision interroge cette relation.","Modellen":"Modèles","Moeten we meteen naar ABAC?":"Faut-il passer tout de suite à l'ABAC ?","Nee. Eerst gaan de regels van nu één op één naar het beslispunt. Daarna komen eigenschappen en relaties erbij, per soort stuk.":"Non. D'abord, les règles actuelles passent telles quelles au point de décision. Ensuite viennent les attributs et les relations, par type de document.","Inwoners":"Habitants","Staan inwoners ook in Saviynt?":"Les habitants figurent-ils aussi dans Saviynt ?","Nee. Inwoners melden zich aan met DigiD in een aparte omgeving van Keycloak, en krijgen alleen hun eigen stukken en openbare stukken.":"Non. Les habitants se connectent avec DigiD dans un domaine distinct de Keycloak, et n'obtiennent que leurs propres documents et les documents publics.","IAM":"IAM","Identity and access management: wie iemand is en wat die mag.":"Gestion des identités et des accès (IAM) : qui est la personne et ce qu'elle peut faire.","IGA":"IGA","Identity governance and administration: het beheer van rechten, met aanvragen, goedkeuring en herziening.":"Gouvernance et administration des identités (IGA) : la gestion des droits, avec demandes, approbation et révision.","Geboorterecht":"Habilitation de base","Recht dat bij een functie hoort, zonder aanvraag.":"Droit lié à une fonction, sans demande.","Rechtenstapeling":"Accumulation de droits","Rechten die zich opstapelen omdat oude niet worden ingetrokken.":"Droits qui s'accumulent parce que les anciens ne sont pas retirés.","Het periodiek herzien van rechten door de leidinggevende.":"La révision périodique des droits par le responsable.","Combinaties van rechten die niet bij één persoon mogen liggen.":"Combinaisons de droits qui ne doivent pas être détenues par une seule personne.","Toegang op grond van een rol.":"Accès fondé sur un rôle.","Toegang op grond van eigenschappen van persoon, stuk en situatie.":"Accès fondé sur les attributs de la personne, du document et du contexte.","Toegang op grond van een relatie, zoals behandelaar van een zaak.":"Accès fondé sur une relation, par exemple agent traitant d'une affaire.","Toegang op grond van beleid als code, dat de andere combineert.":"Accès fondé sur une politique sous forme de code, qui combine les autres.","Het onderdeel dat besluit of iets mag (PDP).":"Le composant qui décide si une action est permise (PDP).","Handhavingspunt":"Point d'application","Het onderdeel dat het besluit uitvoert (PEP).":"Le composant qui applique la décision (PEP).","Standaard voor de vraag van handhavingspunt aan beslispunt.":"Norme pour la requête du point d'application au point de décision.","SCIM":"SCIM","Standaard om accounts en groepen aan te maken en op te heffen.":"Norme pour créer et supprimer des comptes et des groupes.","Een token inruilen voor een token voor een ander systeem, namens dezelfde persoon.":"Échanger un jeton contre un jeton pour un autre système, au nom de la même personne.","Break-glass":"Bris de glace","Toegang in uitzonderingen, met een vastgelegde reden en een melding.":"Accès d'urgence dans des cas exceptionnels, avec un motif consigné et une notification.","Interactieve demo, versie {0}":"Démo interactive, version {0}","Programma-architect en senior consultant":"Architecte de programme et consultant senior","Afdeling i-Ontwikkeling, Gemeente Haarlem":"Service i-Ontwikkeling, commune de Haarlem","Gemaakt door":"Réalisé par","Met assistentie van":"Avec l'assistance de","Contact":"Contact","Het ontwerp van geautomatiseerd gebruikersbeheer voor de systemen uit de demo's":"La conception d'une gestion automatisée des utilisateurs pour les systèmes des démos","IT-beheer, security en architecten van de gemeenten Haarlem en Zandvoort":"L'exploitation informatique, la sécurité et les architectes des communes de Haarlem et Zandvoort","Het Common Ground-team en het samenwerkingsverband OWC":"L'équipe Common Ground et le partenariat OWC","Ten behoeve van":"À l'intention de","Naar Iris, de boodschapper van de Griekse goden: zij brengt het bericht naar wie het aangaat":"D'après Iris, messagère des dieux grecs : elle porte le message à qui il concerne","Naam":"Nom","XENA, archiefwaardige opslag voor de medewerker":"XENA, stockage à valeur archivistique pour les agents","De architectuurvisie waarop deze demo is gebaseerd":"La vision d'architecture sur laquelle repose cette démo","Achtergrond":"Contexte","Gemeente Haarlem":"Commune de Haarlem","Copyright":"Droits d'auteur","Vrij te gebruiken, aan te passen en te verspreiden onder de European Union Public Licence (EUPL) 1.2.":"Libre d'utilisation, de modification et de diffusion sous la licence publique de l'Union européenne (EUPL) 1.2.","Tekst van de licentie":"Texte de la licence","Licentie":"Licence","Een demo, geen product. Personen, stukken en aantallen zijn verzonnen. De demo toont wat de architectuur mogelijk maakt; welke leveranciers meewerken, moet nog blijken.":"Une démo, pas un produit. Les personnes, les documents et les chiffres sont fictifs. La démo montre ce que l'architecture rend possible ; reste à voir quels fournisseurs y participeront.","Sluiten":"Fermer","Bevat persoonsgegevens en is niet geanonimiseerd. Eerst anonimiseren in de Office Assistent.":"Contient des données à caractère personnel et n'est pas anonymisé. Anonymiser d'abord dans l'Assistant Office.","Eigenaar of lid van het team, en het stuk is nog niet vastgesteld.":"Titulaire ou membre de l'équipe, et le document n'est pas encore arrêté.","Geen eigenaar en geen lid van het team.":"Ni titulaire ni membre de l'équipe.","Geen vraag gevonden. Probeer een ander woord.":"Aucune question trouvée. Essayez un autre mot.","Te krap in het huidige model: toegang die past bij de relatie met het stuk, ontbreekt.":"Trop restrictif dans le modèle actuel : un accès justifié par la relation avec le document fait défaut.","Teammap van {0}: lezen en schrijven voor het hele team.":"Dossier partagé ({0}) : lecture et écriture pour toute l'équipe."}};</script>
