<title>IRIS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@400;600&display=swap">
<style>
/* Layout: demokader met tabbladen Architectuur, Techniek, Groeipad en Help. Vormtaal gelijk aan XENA, MIRA, TINA, ELSA en VERA. */
:root{
  --bg:#eaeff0; --surface:#ffffff; --surface2:#f3f7f7; --line:#d3dcde; --fg:#15262b; --muted:#536970;
  --accent:#0d6470; --accent-fg:#ffffff; --accent-soft:#dcedef; --sel:#e2f0f2;
  --amber:#8f5400; --amber-soft:#fbefd6; --red:#a8261d; --red-soft:#fbe3e0;
  --violet:#5b3fa6; --violet-soft:#ebe5f8; --green:#1b6f3f; --green-soft:#def2e5; --blue:#2c5c9c; --blue-soft:#e1eaf7;
  --app:#0f6cbd; --shadow:0 10px 30px rgba(10,40,46,.18);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --serif:'IBM Plex Serif',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1618; --surface:#162023; --surface2:#1c292d; --line:#2c3c41; --fg:#e4eced; --muted:#93a7ad;
  --accent:#58b9c7; --accent-fg:#06272c; --accent-soft:#17383e; --sel:#1b3a40;
  --amber:#f0b656; --amber-soft:#3a2c10; --red:#f28b82; --red-soft:#3d1c19;
  --violet:#b7a2f0; --violet-soft:#2a2244; --green:#6fcf97; --green-soft:#163322; --blue:#8fb6ec; --blue-soft:#1a2b45;
  --app:#6cb0f0; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#162023; --surface2:#1c292d; --line:#2c3c41; --fg:#e4eced; --muted:#93a7ad;
  --accent:#58b9c7; --accent-fg:#06272c; --accent-soft:#17383e; --sel:#1b3a40;
  --amber:#f0b656; --amber-soft:#3a2c10; --red:#f28b82; --red-soft:#3d1c19;
  --violet:#b7a2f0; --violet-soft:#2a2244; --green:#6fcf97; --green-soft:#163322; --blue:#8fb6ec; --blue-soft:#1a2b45;
  --app:#6cb0f0; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
svg{display:block;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.shell{display:flex;flex-direction:column;gap:10px;padding-block:12px;padding-inline:16px;max-width:1360px;margin-inline:auto}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.ttl{flex:1 1 240px;min-width:0}
.ttl h1{font-size:17px;font-weight:600}
.ttl h1 small{font-size:12px;font-weight:500;color:var(--muted);margin-left:10px;white-space:nowrap}
.ttl .sub{color:var(--muted);font-size:12.5px}
.seg{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:6px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.lang{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.linkbtn{color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);font-weight:500;background:var(--surface);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--sel)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:500;line-height:18px;white-space:nowrap}
.p-green{background:var(--green-soft);color:var(--green)} .p-amber{background:var(--amber-soft);color:var(--amber)}
.p-red{background:var(--red-soft);color:var(--red)} .p-violet{background:var(--violet-soft);color:var(--violet)}
.p-blue{background:var(--blue-soft);color:var(--blue)} .p-grey{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.hint{font-size:12.5px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.regie{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 12px;background:var(--surface);border:1px dashed var(--muted);border-radius:8px;font-size:12.5px;color:var(--muted)}
.regie b{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.regie .seg button{padding:3px 10px;font-size:12.5px}
.win{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(10,40,46,.10)}
.page{padding:20px 22px 26px;display:grid;gap:16px}
.page h2{font-size:19px;font-weight:600;text-wrap:balance}
.lead{max-width:72ch;color:var(--muted)}
.note{border-radius:8px;padding:9px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.n-amber{background:var(--amber-soft);color:var(--amber)} .n-violet{background:var(--violet-soft);color:var(--violet)} .n-green{background:var(--green-soft);color:var(--green)} .n-grey{background:var(--surface2);color:var(--fg)} .n-red{background:var(--red-soft);color:var(--red)}
.note span{color:var(--fg)} .note svg{margin-top:2px}

/* mailprogramma */
.mc-top{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--app);color:#fff;font-size:12.5px;flex-wrap:wrap}
.mc-top b{font-weight:600}.mc-top .acc{margin-left:auto;opacity:.92}
.seg2{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface);flex-wrap:wrap}.seg2 button{flex:1;padding:4px 8px;border-radius:6px;font-size:12.5px}.seg2 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg,#fff)}
.box{display:grid;gap:3px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.box.dash{border-style:dashed;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:8px}.box.dash>span{display:block}
.fnd{display:grid;gap:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.fnd.selc{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}.fnd.done{opacity:.75}
.fnd .fh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}.fnd .fh b{overflow-wrap:anywhere}.fnd .fz{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}.fnd .r2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.apb>.btn{white-space:normal;text-align:left;justify-content:flex-start}
.rowb2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.plh{display:inline-block;padding:0 4px;border-radius:4px;background:var(--green-soft);color:var(--green);font-family:var(--mono);font-size:.88em;border:1px solid transparent;cursor:pointer}.plh.pv{border:1px dashed var(--green)}.plh.dec{font-family:inherit;font-size:1em;background:var(--amber-soft,#fff3d6);color:inherit}.plh.on{outline:2px solid var(--accent)}
.anbar{display:flex;gap:6px;align-items:center;padding:6px 10px;margin:6px 0;border-radius:6px;background:var(--green-soft);color:var(--green);font-size:12.5px}
.vec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;background:var(--surface)}.vec header{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}.vec header span{font-size:12px;color:var(--muted)}.vec header .linkbtn{margin-left:auto;font-size:12px}
.vec .vv{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.vec .vv b{font-weight:600}.vec .claim{margin:0;padding-top:6px;border-top:1px solid var(--line)}
.pon{display:grid;gap:4px;margin:0;padding:0;list-style:none}.pon li{display:grid;font-size:12.5px}.pon small{color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}
.accb{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:8px 10px;display:grid;gap:6px;background:var(--surface2)}.accb .ah{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.accb .ah .pill{margin-left:auto}
.accb ul{display:grid;gap:5px;margin:0;padding:0;list-style:none}.accb li{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;font-size:12.5px}.accb li .btn{flex:none}
.rgrp{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.nc-head{display:flex;align-items:center;gap:4px;padding:4px 10px;background:#0082c9;color:#fff;flex-wrap:wrap}.nc-logo{font-weight:700;margin-right:10px;letter-spacing:.02em}
.nc-app{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 8px;border-radius:6px;color:#fff;font-size:10.5px;opacity:.85}.nc-app.on,.nc-app:hover{opacity:1;background:rgba(255,255,255,.15)}
.nc-head .sp,.nc-bar .sp,.rc-bar .sp{flex:1}.nc-head input[type=search]{flex:0 1 240px;min-width:110px;padding:4px 10px;border:0;border-radius:99px;font-size:12.5px;background:rgba(255,255,255,.95)}
.nc-av{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#fff;color:#0082c9;font-size:11px;font-weight:700;margin-left:6px}
.nc-bar,.rc-sub{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line);background:var(--surface)}.nc-bar .sep{width:1px;height:20px;background:var(--line);margin-inline:4px}
.cl-ncm .tb.pri{background:#0082c9}.cl-ncm .mc-top{background:#00679e}
.rc-head{display:flex;align-items:center;gap:12px;padding:5px 12px;background:#2f3a3f;color:#fff;flex-wrap:wrap}.rc-logo{font-weight:700}.rc-head nav{display:flex;gap:2px;flex-wrap:wrap}
.rc-task{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:5px;color:#cfd8dc;font-size:12.5px}.rc-task.on,.rc-task:hover{background:rgba(255,255,255,.12);color:#fff}
.rc-bar{display:flex;align-items:stretch;gap:2px;padding:4px 8px;background:var(--surface2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.rc-big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 14px;border-radius:6px;font-size:12px;margin-right:8px}.rc-big.pri{background:#37beff;color:#fff}
.cl-rc .mc-top{background:#37474f}.cl-rc .rb svg{color:#37474f}
.rc-sub select{padding:3px 5px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:12.5px}.rc-sub input[type=search]{flex:1 1 200px;min-width:0;padding:4px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:12.5px}
.help{display:grid;gap:16px;align-content:start}.help .lead{margin:0;color:var(--muted);max-width:80ch}
.hsec{display:grid;gap:10px}.hsec>h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 0 0;font-weight:600}
.hcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.hcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:grid;gap:6px;align-content:start}.hcard h4{margin:0;font-size:13.5px;font-weight:600}.hcard p{margin:0;font-size:12.5px;color:var(--muted)}.hcard .linkbtn{justify-self:start}
.hsteps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.hsteps li{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:8px 10px;background:var(--surface);display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:12.5px}.hsteps .gnum{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent)}
.help .hq{max-width:360px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.faq{display:grid;gap:6px;max-width:900px}.faq details{border:1px solid var(--line);border-radius:8px;background:var(--surface)}.faq summary{cursor:pointer;padding:9px 12px;font-weight:500;font-size:13px}
.faq details>div{padding:0 12px 10px;font-size:13px;color:var(--muted);max-width:75ch}.faq .cat{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-right:8px}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:0 18px;margin:0}.gloss>div{display:grid;grid-template-columns:160px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}.gloss dt{font-weight:600}.gloss dd{margin:0;color:var(--muted)}
@media (max-width:640px){.gloss>div{grid-template-columns:minmax(0,1fr);gap:2px}}
.ol-tabs{display:flex;align-items:center;gap:2px;padding:4px 10px 0;background:var(--surface2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ol-tabs>button{padding:6px 10px;font-size:12.5px;border-bottom:2px solid transparent;color:var(--fg)}
.ol-tabs>button[aria-pressed="true"]{border-bottom-color:var(--app);color:var(--app);font-weight:600}
.ol-tabs>button.file{background:var(--app);color:#fff;border-radius:4px 4px 0 0;margin-right:6px}
.ol-tabs .sp,.tb-uni .sp,.tb-qf .sp{flex:1}
.ol-tabs input[type=search],.tb-uni input[type=search]{flex:0 1 260px;min-width:120px;margin:0 0 4px;padding:4px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:12.5px}
.ribbon{display:flex;align-items:stretch;gap:0;padding:4px 6px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.rg{display:flex;flex-direction:column;align-items:stretch;padding:0 8px;border-right:1px solid var(--line);flex:none}
.rgb{display:flex;align-items:flex-start;gap:2px;flex:1}.rgl{font-size:10.5px;color:var(--muted);text-align:center;padding-top:2px}
.rb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 6px;border-radius:4px;font-size:11.5px;max-width:84px;text-align:center;line-height:1.2;color:var(--fg)}.rb svg{color:var(--app)}
.rb:hover:not(:disabled){background:var(--sel)}.rb:disabled{opacity:.45;cursor:default}.rb[aria-pressed="true"]{background:var(--accent-soft)}
.rcol{display:flex;flex-direction:column;gap:1px}.rcol .tb{padding:2px 6px;font-size:11.5px}.rcol select{padding:1px 4px;border:1px solid var(--line);border-radius:4px;font-size:11.5px;background:var(--surface)}
.tb[aria-pressed="true"]{background:var(--accent-soft)}
.tb.pri{background:var(--app);color:#fff}.tb.pri svg{color:#fff}
.ol-simple,.tb-uni,.tb-qf{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.ol-simple .sep,.tb-uni .sep{width:1px;height:20px;background:var(--line);margin-inline:4px}
.ol-simple select,.tb-qf select{padding:3px 5px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:12.5px}
.tb-menu{display:flex;gap:0;padding:2px 8px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:12.5px}.tb-menu button{padding:3px 9px;border-radius:4px}.tb-menu button:hover{background:var(--sel)}
.tb-qf{background:var(--surface2);font-size:12px;gap:4px 6px}.tb-qf>span:first-child{color:var(--muted);font-weight:600}
.tb-qf .chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:12px}
.cl-tb .mc-top{background:var(--surface2);color:var(--fg);border-bottom:1px solid var(--line)}.cl-tb .mc-top svg{color:var(--app)}
.cl-oln .mc-top{background:var(--app)}
.rd-act{display:flex;flex-wrap:wrap;gap:2px;justify-content:flex-end;padding:4px 8px;border-bottom:1px solid var(--line)}.rd-act .tb{font-size:12px;padding:3px 7px}
.mi:not(.read){border-left-color:var(--app)}.mi:not(.read) .r1 b{font-weight:700}.mi:not(.read) .sj{font-weight:700;color:var(--app)}
.cl-tb .mi:not(.read) .sj{color:var(--fg)}
.mi.read .r1 b{font-weight:400}
.mc-bar{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--surface2)}
.mc-bar .sep{width:1px;height:20px;background:var(--line);margin-inline:4px}
.tb{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:5px;font-size:12.5px;color:var(--fg)}
.tb:hover:not(:disabled){background:var(--sel)} .tb:disabled{opacity:.45;cursor:default} .tb svg{color:var(--app)}
.mc-bar select{padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:12.5px}
.mc-bar input[type=search]{flex:1 1 200px;min-width:0;padding:5px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.mc{display:grid;grid-template-columns:190px 290px minmax(0,1fr) 340px;min-height:580px}.mc.nopane{grid-template-columns:190px 300px minmax(0,1fr)}
.tag{font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}.tag::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.t-amber{color:var(--amber)}.t-green{color:var(--green)}.t-violet{color:var(--violet)}
.tb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ap{display:flex;border-left:1px solid var(--line);background:color-mix(in srgb,var(--accent-soft) 30%,var(--surface));min-width:0;max-height:640px}
.ap.off{display:block;background:var(--surface2);overflow:auto}
.apm{flex:1;min-width:0;overflow:auto}
.aph{position:sticky;top:0;display:flex;gap:9px;align-items:center;padding:8px 12px;background:var(--accent-soft);border-bottom:1px solid var(--line);border-left:3px solid var(--accent);z-index:1}
.aph h3{font-size:13.5px}.aph p{font-size:11.5px;color:var(--muted)}.aph svg{color:var(--accent)}
.apb{padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;font-size:13px}.apb>*{min-width:0}.apb h3{font-size:14px}.apb h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:6px}.apb h4 b{color:var(--fg)}
.apl{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}.apl li{min-width:0}.apl button{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12.5px}.apl button span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apl button:hover{border-color:var(--accent)}
.apl .gn{display:grid;gap:1px;text-align:left}.apl .gn small{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.apl .gs{color:var(--amber);flex:none}
.gchips{display:flex;flex-wrap:wrap;gap:4px}.gchips button{padding:2px 9px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:12px}.gchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.gme{display:flex;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.gme svg{color:var(--accent);flex:none}.gme div{flex:1;min-width:0;display:grid}.gme span{font-size:12px;color:var(--muted)}.gme .btn{padding:4px 10px;font-size:12.5px}

.tok.s2 .fl-up{animation:flFlap .5s ease both}.tok.s2 .fl-sheet{animation:flSheet .6s ease .25s both}.tok.s4 .fl-id{animation:flFade .5s both}.tok.s8 .fl-dot{animation:flPop .45s cubic-bezier(.2,1.6,.4,1) both;transform-box:fill-box;transform-origin:center}

  ['Zaaksysteem','Neemt IAM de rechten van het zaaksysteem over?','Nee. Het zaaksysteem blijft leidend voor wie welke zaak behandelt. Het beslispunt vraagt die relatie op.'],
